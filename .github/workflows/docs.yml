name: Deploy Docs

on:
  push:
    branches:
      - main
      # RFD-40's maintenance branches, where the missing v is the point:
      # release/vX.Y.Z is a single version being cut from main, release/X.Y
      # is the line a released minor is maintained on. Only the second one
      # says anything about what miren.md should be serving, and a docs
      # correction landing there publishes on push.
      - 'release/[0-9]*'
    paths:
      - 'docs/**'
      - 'cli/commands/**'
      - 'hack/gen-command-docs'
      - 'hack/docs-snapshot'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'cli/commands/**'
      - 'hack/gen-command-docs'
      - 'hack/docs-snapshot'
  # A release tag doesn't touch docs/, so the push above won't fire for it.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # hack/docs-snapshot resolves the released docs from a tag or from
          # release/X.Y, and reads the version label off the tags reachable
          # from it. A shallow, tagless checkout can see none of that.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: docs

      # docs/plugins/og-images keeps every rendered social card here, keyed by
      # its inputs, so a run only renders the pages whose title or description
      # changed. The key never matches exactly (run_id), which makes every run
      # save its additions; restore-keys picks up the newest one, and a change
      # to the plugin itself starts a fresh line rather than growing the old.
      - name: Restore social card cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/node_modules/.cache/og-images
          key: og-images-${{ hashFiles('docs/plugins/og-images/**') }}-${{ github.run_id }}
          restore-keys: |
            og-images-${{ hashFiles('docs/plugins/og-images/**') }}-

      # Materializes the released docs so the build serves them at the site
      # root with this branch's docs at /next. Skipped on pull requests, which
      # publish nothing and only check that the docs still compile.
      - name: Snapshot released docs
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: hack/docs-snapshot

      - name: Build website
        run: bun run build
        working-directory: docs

      # The push triggers are branch-filtered above, but a dispatch names its
      # own ref, so it is pinned to main here. Otherwise any feature branch
      # could be dispatched straight onto miren.md.
      - name: Upload build artifacts
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/build

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Record start time
        id: start
        run: echo "time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Format Slack success message
        id: slack-message
        run: |
          DOCS_URL="https://miren.md"

          TEXT="✅ Docs deployed: $DOCS_URL"
          echo "text=$TEXT" >> $GITHUB_OUTPUT

          # Calculate deployment duration
          START_TIME="${{ steps.start.outputs.time }}"
          END_TIME=$(date +%s)
          DURATION_SECONDS=$((END_TIME - START_TIME))
          if [ $DURATION_SECONDS -ge 60 ]; then
            MINUTES=$((DURATION_SECONDS / 60))
            SECONDS=$((DURATION_SECONDS % 60))
            DURATION_TEXT="${MINUTES}m ${SECONDS}s"
          else
            DURATION_TEXT="${DURATION_SECONDS}s"
          fi

          # Get short commit SHA
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"

          BLOCKS=$(cat <<EOF
          [
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "✅ *Docs deployed* • <https://miren.md|View site>"
              }
            },
            {
              "type": "context",
              "elements": [
                {
                  "type": "mrkdwn",
                  "text": "${DURATION_TEXT} • <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${SHORT_SHA}>"
                }
              ]
            }
          ]
          EOF
          )

          echo "blocks<<SLACK_EOF" >> $GITHUB_OUTPUT
          echo "$BLOCKS" >> $GITHUB_OUTPUT
          echo "SLACK_EOF" >> $GITHUB_OUTPUT

      - name: Send Slack success notification
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ vars.SLACK_CHANNEL_ID }}",
              "text": "${{ steps.slack-message.outputs.text }}",
              "blocks": ${{ steps.slack-message.outputs.blocks }},
              "unfurl_links": false,
              "unfurl_media": false
            }

      - name: Format Slack failure message
        id: slack-failure
        if: failure()
        run: |
          TEXT="❌ Docs deploy failed"
          echo "text=$TEXT" >> $GITHUB_OUTPUT

          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"

          BLOCKS=$(cat <<EOF
          [
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "❌ *Docs deploy failed* • <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
              }
            },
            {
              "type": "context",
              "elements": [
                {
                  "type": "mrkdwn",
                  "text": "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${SHORT_SHA}>"
                }
              ]
            }
          ]
          EOF
          )

          echo "blocks<<SLACK_EOF" >> $GITHUB_OUTPUT
          echo "$BLOCKS" >> $GITHUB_OUTPUT
          echo "SLACK_EOF" >> $GITHUB_OUTPUT

      - name: Send Slack failure notification
        if: failure()
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ vars.SLACK_CHANNEL_ID }}",
              "text": "${{ steps.slack-failure.outputs.text }}",
              "blocks": ${{ steps.slack-failure.outputs.blocks }},
              "unfurl_links": false,
              "unfurl_media": false
            }
