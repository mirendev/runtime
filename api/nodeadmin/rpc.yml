apiVersion: miren.dev/rpc/v1
kind: IDL

# Work the coordinator asks one specific node to do to itself.
#
# This is separate from the exec service because it is not about a sandbox: it
# acts on the host, and the coordinator picks the node rather than deriving it
# from a workload's placement.

interfaces:
  - name: NodeAdmin
    methods:
      - name: install_disk_accelerator
        doc: |
          Build and load the lbd kernel module on this node, so its disks can
          use accelerator mode instead of loop devices.

          The module has to be compiled against the kernel actually running
          here, which is why this happens on the node rather than centrally.
          The toolchain image is built once by the coordinator and pulled from
          the cluster registry.
        parameters:
          - name: image
            type: string
            doc: Toolchain image reference to build with
          - name: force
            type: bool
            doc: Rebuild even when the installed module is already current
        results:
          - name: kernel_release
            type: string
            doc: Kernel the module was built for
          - name: lbd_version
            type: string
            doc: lbd version that was installed
          - name: error
            type: string
            doc: Error message if the install failed

      - name: query
        index: 1
        doc: Query live host activity during a window of up to one minute, never historical data.
        parameters:
          - name: expression
            type: string
            doc: Live query expression (not SQL)
        results:
          - name: data
            type: bytes
            doc: JSON-encoded live snapshot or aggregate
          - name: error
            type: string
            doc: Error message if parsing or execution failed
          - name: engine_revision
            type: string
            doc: This host's query language revision, including on parse or execution errors; absent on older runners

      - name: query_info
        index: 2
        doc: Get this host's complete live query syntax and source reference without collecting data.
        results:
          - name: engine_revision
            type: string
            doc: This host's query language revision
          - name: reference
            type: string
            doc: Self-contained query syntax, source fields, examples, semantics, and limits
          - name: error
            type: string
            doc: Error message if the reference could not be returned

      - name: validate_query
        index: 3
        doc: Parse and validate a live query on this host without collecting data or attaching probes; does not check runtime prerequisites.
        parameters:
          - name: expression
            type: string
            doc: Live query expression to validate against this host's grammar and sources
        results:
          - name: engine_revision
            type: string
            doc: This host's query language revision, including on validation errors
          - name: valid
            type: bool
            doc: True if parsing, semantic validation, and native syscall-name resolution succeeded
          - name: error
            type: string
            doc: Validation or authorization error; empty for a valid query
