imports:
  standard:
    path: ../../pkg/rpc/standard/standard.yml
    import: miren.dev/runtime/pkg/rpc/standard

types:
  # One version of a secret. The payload is never carried here — only what an
  # operator needs to reason about the version.
  - type: SecretVersionInfo
    fields:
      - name: version
        type: string
        index: 0
        doc: "The version handle referenced after an @, e.g. x1A"
      - name: state
        type: string
        index: 1
        doc: "enabled, disabled or destroyed"
      - name: created_at
        type: int64
        index: 2
        doc: "Creation time in milliseconds since the epoch"
      - name: current
        type: bool
        index: 3
        optional: true
        doc: "Whether a floating reference resolves to this version"

  - type: KeyInfo
    fields:
      - name: id
        type: string
        index: 0
      - name: current
        type: bool
        index: 1
      - name: created_at
        type: int64
        index: 2
        doc: "Creation time in milliseconds since the epoch; 0 for a key minted before keys carried one"
      - name: versions
        type: int64
        index: 3
        doc: "How many stored versions are still wrapped by this key"

  - type: SecretInfo
    fields:
      - name: path
        type: string
        index: 0
      - name: backend
        type: string
        index: 1
      - name: current_version
        type: string
        index: 2
        optional: true
      - name: versions
        type: list
        element: SecretVersionInfo
        index: 3
        optional: true

interfaces:
  # Secrets is the only path by which a value enters or leaves the cluster
  # store. Resolution happens server-side, where the keyring lives, so a client
  # never holds key material and a node that holds none can still materialize a
  # secret by asking for it.
  - name: Secrets
    methods:
      # Store a new version of a secret, returning its version handle. Storing
      # a value identical to the current version returns the existing handle
      # rather than minting a duplicate.
      - name: set
        parameters:
          - name: backend
            type: string
            optional: true
            doc: "Backend instance to store into; defaults to the cluster backend"
          - name: path
            type: string
          - name: value
            type: bytes
        results:
          - name: version
            type: string
          - name: unchanged
            type: bool
            doc: "True when the value matched the current version and no new one was minted"

      - name: list
        parameters:
          - name: backend
            type: string
            optional: true
        results:
          - name: secrets
            type: list
            element: SecretInfo

      - name: listVersions
        parameters:
          - name: backend
            type: string
            optional: true
          - name: path
            type: string
        results:
          - name: secret
            type: SecretInfo

      # Report the cluster keyring: which keys exist, which is current, how
      # many versions still sit on each, and whether a rotation is in flight.
      - name: keyring
        parameters: []
        results:
          - name: keys
            type: list
            element: KeyInfo
          - name: rotating
            type: bool
            doc: "True while a rotation is rewrapping or retiring"
          - name: rotating_from
            type: string
            optional: true
          - name: rewrapped
            type: int64
            optional: true

      # Start a key rotation now rather than waiting for the age policy, which
      # is what an incident calls for.
      - name: rotateKey
        parameters: []
        results:
          - name: from_key
            type: string
          - name: to_key
            type: string

      # Transition one version between enabled, disabled and destroyed.
      # Anything still pinned to a version that leaves enabled fails closed on
      # its next resolve.
      - name: setState
        parameters:
          - name: backend
            type: string
            optional: true
          - name: ref
            type: string
            doc: "A reference naming a concrete version, e.g. payments/stripe-key@x1A"
          - name: state
            type: string
        results: []
