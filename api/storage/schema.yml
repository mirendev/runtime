domain: dev.miren.storage
version: v1alpha
enums:
  disk_filesystem:
    values: [ext4, xfs, btrfs]
  disk_status:
    values: [provisioning, provisioned, attached, detached, deleting, error, restoring]
  disk_mode:
    values: [universal, accelerator]
  disk_lease_status:
    values: [pending, bound, failed, released]
  volume_mode:
    values: [vm_universal, vm_accelerator]
  volume_desired_state:
    values: [dv_present, dv_absent]
  volume_actual_state:
    values: [dv_pending, dv_creating, dv_ready, dv_deleting, dv_deleted, dv_error]
  mount_desired_state:
    values: [dm_want_mounted, dm_want_unmounted]
  mount_actual_state:
    values: [dm_pending, dm_attaching, dm_attached, dm_mounting, dm_mounted, dm_unmounting, dm_detaching, dm_detached, dm_error]
kinds:
  disk:
    name:
      type: string
      doc: Human-readable name for the disk
      required: true
      indexed: true

    size_gb:
      type: int
      doc: Storage capacity in gigabytes
      required: true

    filesystem:
      type: enum
      enum: disk_filesystem
      encoding: ref
      doc: Filesystem type for the disk
      default: ext4

    status:
      type: enum
      enum: disk_status
      encoding: ref
      doc: Current state of the disk
      default: provisioning
      indexed: true

    mode:
      type: enum
      enum: disk_mode
      encoding: ref
      doc: Disk I/O mode
      default: universal
      indexed: true

    volume_id:
      type: string
      doc: Volume identifier for universal/accelerator mode disks
      indexed: true

    remote_only:
      type: bool
      doc: If true, disk is stored only remotely without local replica
      default: false

    created_by:
      type: ref
      doc: Application that created this disk (for tracking purposes)
      indexed: true
      tags: [dev.miren.app_ref]

  disk_lease:
    disk_id:
      type: ref
      doc: Reference to the leased disk
      required: true
      indexed: true

    sandbox_id:
      type: ref
      doc: Reference to the sandbox using the disk
      indexed: true

    app_id:
      type: ref
      doc: Reference to the application (for debugging)
      indexed: true
      tags: [dev.miren.app_ref]

    status:
      type: enum
      enum: disk_lease_status
      encoding: ref
      doc: Current state of the lease
      default: pending
      indexed: true
      # pending - Lease requested but not yet bound
      # bound - Lease successfully bound to disk
      # failed - Lease could not be bound (conflict or error)
      # released - Lease explicitly released

    mount:
      type: component
      doc: Mount configuration for the disk
      attrs:
        path:
          type: string
          doc: Mount path in the container
          required: true
        options:
          type: string
          doc: Mount options (e.g., "rw,noatime")
          default: "rw"
        read_only:
          type: bool
          doc: Whether the mount is read-only
          default: false

    acquired_at:
      type: time
      doc: When the lease was acquired

    node_id:
      type: ref
      doc: Node where the disk is mounted
      required: true

    error_message:
      type: string
      doc: Error details if lease binding failed

  disk_volume:
    name:
      type: string
      doc: Human-readable name for the volume (from parent disk)

    disk_id:
      type: ref
      doc: Reference to the parent Disk entity
      required: true
      indexed: true

    volume_id:
      type: string
      doc: Volume identifier (generated during creation)
      indexed: true

    size_gb:
      type: int
      doc: Volume size in gigabytes
      required: true

    filesystem:
      type: enum
      enum: disk_filesystem
      encoding: string
      doc: Filesystem type (ext4, xfs, btrfs)
      default: ext4

    volume_mode:
      type: enum
      enum: volume_mode
      encoding: ref
      doc: Disk I/O mode
      default: vm_universal

    image_path:
      type: string
      doc: Path to backing image file

    desired_state:
      type: enum
      enum: volume_desired_state
      encoding: ref
      doc: What state should this volume be in
      default: dv_present
      indexed: true

    actual_state:
      type: enum
      enum: volume_actual_state
      encoding: ref
      doc: Current state of the volume
      default: dv_pending
      indexed: true

    error_message:
      type: string
      doc: Error details if actual_state is error

    mount_id:
      type: string
      doc: Override for the mount point directory name (defaults to entity suffix if empty)

    cloud_volume_id:
      type: string
      doc: Identifier for this volume in miren.cloud, assigned when the disk controller registers it there (empty until then)

    node_id:
      type: ref
      doc: Node where this volume should be provisioned
      required: true
      indexed: true

  disk_mount:
    volume_id:
      type: ref
      doc: Reference to the disk_volume entity
      required: true
      indexed: true

    disk_lease_id:
      type: ref
      doc: Reference to the parent DiskLease entity
      indexed: true

    mount_path:
      type: string
      doc: Path where the volume should be mounted
      required: true

    read_only:
      type: bool
      doc: Whether the mount is read-only
      default: false

    device_path:
      type: string
      doc: Full path to the device node (e.g., /dev/loopN)

    loop_device:
      type: string
      doc: Loop device name for universal mode

    desired_state:
      type: enum
      enum: mount_desired_state
      encoding: ref
      doc: What state should this mount be in
      default: dm_want_mounted
      indexed: true

    actual_state:
      type: enum
      enum: mount_actual_state
      encoding: ref
      doc: Current state of the mount
      default: dm_pending
      indexed: true

    node_id:
      type: ref
      doc: Node where this mount exists
      required: true
      indexed: true

    error_message:
      type: string
      doc: Error details if actual_state is error
