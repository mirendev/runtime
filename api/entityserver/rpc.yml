apiVersion: miren.dev/rpc/v1
kind: IDL

imports:
  stream:
    path: ../../pkg/rpc/stream/stream.yml
    import: miren.dev/runtime/pkg/rpc/stream
  entity:
    import: miren.dev/runtime/pkg/entity
    types:
      - Attr

types:
  - type: ReindexStat
    fields:
      - name: name
        type: string
        index: 0
      - name: value
        type: int64
        index: 1

  - type: AttributeSchema
    fields:
      - name: id
        type: string
        index: 0
      - name: doc
        type: string
        index: 1
      - name: attrType
        type: string
        index: 2
      - name: allowMany
        type: bool
        index: 3
      - name: indexed
        type: bool
        index: 4
      - name: session
        type: bool
        index: 5
      - name: tags
        type: list
        element: string
        index: 6

  - type: Entity
    fields:
      - name: id
        type: string
        index: 0
      - name: revision
        type: int64
        index: 1
      - name: created_at
        type: int64
        index: 2
      - name: updated_at
        type: int64
        index: 3
      - name: attrs
        type: list
        element: entity.Attr
        index: 4

  - type: EntityOp
    fields:
      - name: entity
        type: Entity
        index: 0
      - name: previous
        type: int64
        index: 1
      - name: operation
        type: int64
        index: 2
      - name: entity_id
        type: string
        index: 3
      - name: revision
        type: int64
        index: 4

  - type: ParsedFile
    fields:
      - name: format
        type: string
        index: 0
      - name: entities
        type: list
        element: Entity
        index: 1

interfaces:
  - name: Stream
    methods:
      - name: recv
        parameters:
          - name: count
            type: int32
        results:
          - name: data
            type: bytes

  - name: EntityAccess
    methods:
      - name: get
        parameters:
          - name: id
            type: string
        results:
          - name: entity
            type: Entity

      - name: put
        parameters:
          - name: entity
            type: Entity
        results:
          - name: revision
            type: int64
          - name: id
            type: string

      - name: create
        parameters:
          - name: attrs
            type: list
            element: entity.Attr
        results:
          - name: revision
            type: int64
          - name: id
            type: string

      - name: replace
        parameters:
          - name: attrs
            type: list
            element: entity.Attr
          - name: revision
            type: int64
            optional: true
        results:
          - name: revision
            type: int64
          - name: id
            type: string

      - name: patch
        parameters:
          - name: attrs
            type: list
            element: entity.Attr
          - name: revision
            type: int64
            optional: true
        results:
          - name: revision
            type: int64
          - name: id
            type: string

      - name: ensure
        parameters:
          - name: attrs
            type: list
            element: entity.Attr
        results:
          - name: revision
            type: int64
          - name: id
            type: string
          - name: created
            type: bool

      - name: put_session
        parameters:
          - name: entity
            type: Entity
          - name: session
            type: string
        results:
          - name: revision
            type: int64
          - name: id
            type: string

      - name: delete
        parameters:
          - name: id
            type: string
        results:
          - name: revision
            type: int64

      - name: watch_index
        parameters:
          - name: index
            type: entity.Attr
          - name: from_revision
            type: int64
          - name: values
            type: stream.SendStream[*EntityOp]

      - name: watch_entity
        parameters:
          - name: id
            type: string
          - name: updates
            type: stream.SendStream[*EntityOp]

      - name: list
        parameters:
          - name: index
            type: entity.Attr
        results:
          - name: values
            type: list
            element: Entity
          - name: revision
            type: int64

      - name: makeAttr
        parameters:
          - name: id
            type: string
          - name: value
            type: string
        results:
          - name: attr
            type: entity.Attr

      - name: lookupKind
        parameters:
          - name: kind
            type: string
        results:
          - name: attr
            type: entity.Attr

      - name: parse
        parameters:
          - name: data
            type: bytes
        results:
          - name: file
            type: ParsedFile

      - name: get_document
        doc: |
          Fetch one entity already rendered into a presentation document.
        parameters:
          - name: id
            type: string
          - name: max_value_len
            type: int64
            doc: Elide byte and string values longer than this. Zero keeps them whole, which is what the JSON path asks for.
        results:
          - name: document
            type: bytes
            doc: A JSON-encoded model.Document.

      - name: list_documents
        doc: |
          List entities and render them into presentation documents server-side.

          `debug entity list` used to call format once per entity, costing a
          round trip each, which dominated its runtime against a cluster holding
          thousands of entities. Paging here rather than in the client also keeps
          the entities past the limit from being read out of the store at all, so
          a page costs the same whether the index holds ten entries or a million.
        parameters:
          - name: index
            type: entity.Attr
          - name: cursor
            type: string
            doc: Opaque resume point from a previous page. Empty starts at the head.
          - name: limit
            type: int64
            doc: Maximum entities to fetch and render. Zero or less means no limit.
          - name: max_value_len
            type: int64
            doc: Elide byte and string values longer than this. Zero keeps them whole.
        results:
          - name: documents
            type: bytes
            doc: A JSON array of model.Document.
          - name: cursor
            type: string
            doc: Resume point for the next page, empty when the index is exhausted.
          - name: total
            type: int64
            doc: Entries in the index, reported only when starting from the head.

      - name: create_session
        parameters:
          - name: ttl
            type: int64
          - name: usage
            type: string
        results:
          - name: id
            type: string

      - name: revoke_session
        parameters:
          - name: id
            type: string

      - name: ping_session
        parameters:
          - name: id
            type: string

      - name: reindex
        parameters:
          - name: dry_run
            type: bool
        results:
          - name: stats
            type: list
            element: ReindexStat

      - name: get_attributes_by_tag
        parameters:
          - name: tag
            type: string
        results:
          - name: schemas
            type: list
            element: AttributeSchema
