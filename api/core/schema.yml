domain: dev.miren.core
version: v1alpha
kinds:
  metadata:
    name:
      type: string
      doc: The name of the entity
    project:
      type: ref
      doc: A reference to the project the entity belongs to
    labels:
      type: label
      doc: Identifying labels for the entity
      many: true

  project:
    owner:
      type: string
      doc: The email address of the project owner

  app:
    project:
      type: ref
      doc: The project that the app belongs to

    active_version:
      type: ref
      doc: The version of the project that should be used

    active_deployment:
      type: ref
      doc: The deployment attempt that made active_version current

    deployment_lock:
      type: component
      doc: The expiring lock held by the deployment currently mutating this app
      attrs:
        deployment_id:
          type: string
          doc: The deployment attempt that owns the lock
        acquired_at:
          type: time
          doc: When the lock was taken
        expires_at:
          type: time
          doc: When another deployment may take over the lock

    initial_config:
      type: ref
      doc: Reference to the initial ConfigVersion entity created before the first deploy

    workload_role:
      type: string
      doc: >-
        The authorization role that identity tokens minted for this app's
        sandboxes authenticate as (see pkg/workloadroles). Empty means the
        default (app-readonly). Cluster-scoped roles may only be set by an
        operator, never via app.toml.

  artifact:
    app:
      type: ref
      doc: The application the artifact is for
      indexed: true
      tags: [dev.miren.app_ref]

    manifest:
      type: string
      doc: The OCI image manifest for the version

    manifest_digest:
      type: string
      doc: The digest of the manifest
      indexed: true

    status:
      type: enum
      doc: Artifact lifecycle status
      choices: [active, archived]
      indexed: true

  app_version:
    app:
      type: ref
      doc: The application the version is for
      indexed: true
      tags: [dev.miren.app_ref]

    version:
      type: string
      doc: The version of this app

    source:
      type: component
      doc: Sanitized source provenance captured when this version was built
      attrs:
        kind:
          type: string
          doc: Build source kind (image, dockerfile, or stack)
        value:
          type: string
          doc: Normalized image reference or auto-detected stack name, depending on kind
        git_sha:
          type: string
          doc: Git commit SHA used to build the version
        git_branch:
          type: string
          doc: Git branch used to build the version
        repository:
          type: string
          doc: Repository URL without credentials, query parameters, or fragments

    image_url:
      type: string
      doc: The OCI url for the versions code

    artifact:
      type: ref
      doc: The artifact to deploy for the version

    manifest:
      type: string
      doc: The OCI image manifest for the version

    manifest_digest:
      type: string
      doc: The digest of the manifest
      indexed: true

    config:
      type: component
      doc: The configuration of the version
      attrs:
        port:
          type: int
          doc: "[DEPRECATED] Port used for the web service; defaults to 3000. Prefer per-service ports."
        services:
          type: component
          doc: Per-service configuration including concurrency controls
          many: true
          attrs:
            name:
              type: string
              doc: The service name (e.g. web, worker)
            port:
              type: int
              doc: The TCP port the service listens on. For the web service, if not specified it falls back to the deprecated top-level port (if set) or 3000. Other services must specify services.port explicitly and do not inherit the top-level port.
            port_name:
              type: string
              doc: The name of the port (e.g. http, grpc). Defaults to "http" if not specified.
            port_type:
              type: string
              doc: The type of the port (e.g. http, tcp). Defaults to "http" if not specified.
            ports:
              type: component
              doc: Network ports this service listens on. Overrides scalar port/port_name/port_type.
              many: true
              attrs:
                port:
                  type: int
                  required: true
                name:
                  type: string
                  required: true
                protocol:
                  type: enum
                  choices: [tcp, udp]
                type:
                  type: string
                node_port:
                  type: int
            image:
              type: string
              doc: Optional container image for this service (e.g. postgres:16). If not specified, uses the app-level built image.
            env:
              type: component
              doc: Environment variables for this service only
              many: true
              attrs:
                key:
                  type: string
                  doc: The name of the variable
                value:
                  type: string
                  doc: The value of the variable
                sensitive:
                  type: bool
                  doc: Whether or not the value is sensitive
                source:
                  type: string
                  doc: The source of the variable (config or manual). Defaults to config for backward compatibility.
                backend:
                  type: string
                  doc: Where the value comes from. Empty means value holds an inline literal; any other name refers to a registered secret backend instance (e.g. cluster) and value holds a backend-relative reference, optionally pinned with @version.
                required:
                  type: bool
                  doc: Whether this variable must have a non-empty value for deploy to succeed
                description:
                  type: string
                  doc: Human-readable description of this variable's purpose
            service_concurrency:
              type: component
              doc: Concurrency configuration for this service
              attrs:
                mode:
                  type: string
                  doc: The concurrency mode (auto or fixed)
                requests_per_instance:
                  type: int
                  doc: For auto mode, number of concurrent requests per instance
                scale_down_delay:
                  type: string
                  doc: For auto mode, delay before scaling down idle instances (e.g. 2m, 15m)
                num_instances:
                  type: int
                  doc: For fixed mode, number of instances to maintain
                shutdown_timeout:
                  type: string
                  doc: Time to wait for graceful shutdown before force-killing (e.g. 10s, 30s). Defaults to 10s.
            disks:
              type: component
              doc: Disk attachments for this service
              many: true
              attrs:
                name:
                  type: string
                  doc: The name of the disk
                provider:
                  type: enum
                  choices: [miren, local, sqlite]
                  doc: "Disk provider: 'miren' (default) for network disks, 'local' for node-local persistent storage, 'sqlite' for a node-local SQLite database replicated to the coordinator"
                mount_path:
                  type: string
                  doc: The path inside the container where the disk will be mounted
                read_only:
                  type: bool
                  doc: Whether to mount the disk as read-only
                size_gb:
                  type: int
                  doc: Size in GB for auto-creating the disk if it doesn't exist
                filesystem:
                  type: string
                  doc: Filesystem type (ext4, xfs, btrfs) for auto-creating the disk
                db_file:
                  type: string
                  doc: Database filename inside the disk directory, for sqlite disks only; a bare filename, not a path (defaults to data.db)
                sqlite_id:
                  type: string
                  doc: Identity of the database a sqlite disk attaches to, scoped to the app (defaults to "default")
                source:
                  type: string
                  doc: Where this disk came from. Empty or "config" means the user declared it; "addon" means an addon contributed it and owns its removal.
                lease_timeout:
                  type: string
                  doc: Timeout for acquiring the disk lease (e.g. 5m, 10m)
                owner:
                  type: string
                  doc: >-
                    Ownership policy for the mounted disk. Empty (default) makes
                    the disk writable by the container's run user; "keep" leaves
                    the raw mount ownership untouched; "uid" or "uid:gid" pins a
                    specific numeric owner.
        entrypoint:
          type: string
          doc: The container entrypoint command
        start_directory:
          type: string
          doc: Directory to start the process in; defaults to /app.
        commands:
          type: component
          doc: The command to run for a specific service type
          many: true
          attrs:
            service:
              type: string
              doc: The service name
            command:
              type: string
              doc: The command to run for the service
        variable:
          type: component
          doc: A variable to be exposed to the app
          many: true
          attrs:
            key:
              type: string
              doc: The name of the variable
            value:
              type: string
              doc: The value of the value
            sensitive:
              type: bool
              doc: Whether or not the value is sensitive
            source:
              type: string
              doc: The source of the variable (config or manual). Defaults to config for backward compatibility.
            backend:
              type: string
              doc: Where the value comes from. Empty means value holds an inline literal; any other name refers to a registered secret backend instance (e.g. cluster) and value holds a backend-relative reference, optionally pinned with @version.
            required:
              type: bool
              doc: Whether this variable must have a non-empty value for deploy to succeed
            description:
              type: string
              doc: Human-readable description of this variable's purpose

    config_version:
      type: ref
      doc: Reference to the ConfigVersion entity containing the resolved configuration for this version

    admin_token:
      type: string
      doc: Cryptographically random token for authenticating admin API calls. Generated per-version and exposed to the app via ADMIN_TOKEN env var.

    ephemeral_label:
      type: string
      doc: DNS-safe label for ephemeral subdomain routing (e.g., "feat-x"). Empty for non-ephemeral versions.
      indexed: true

    ephemeral_ttl:
      type: string
      doc: TTL duration string (e.g., "48h") for display. Empty for non-ephemeral versions.

    ephemeral_expires_at:
      type: time
      doc: Computed expiration timestamp (creation + TTL). Used by the cleanup controller.
      indexed: true

  deployment:
    # Canonical immutable-attempt fields.
    app:
      type: ref
      doc: The app this attempt targeted
      indexed: true

    version:
      type: ref
      doc: The app version produced or selected by this attempt
      indexed: true

    parent_deployment:
      type: ref
      doc: Optional deployment this attempt was based on

    operation:
      type: string
      doc: The intent of this attempt

    outcome:
      type: string
      doc: Terminal result of this attempt; absent while the attempt is in progress
      indexed: true

    phase:
      type: string
      doc: Last progress phase observed while the attempt was in progress

    started_at:
      type: time
      doc: When the attempt acquired the deployment lock

    completed_at:
      type: string
      doc: RFC3339 time when the attempt reached a terminal outcome

    app_name:
      type: string
      doc: "[DEPRECATED] Denormalized app name retained for downgrade compatibility; canonical identity is app"
      indexed: true

    app_version:
      type: string
      doc: "[DEPRECATED] Version value retained for downgrade compatibility; use version"

    cluster_id:
      type: string
      doc: "[DEPRECATED] Client-supplied cluster display value; coordinator storage is cluster-scoped"
      indexed: true

    status:
      type: string
      doc: "[DEPRECATED] Mutable lifecycle status retained for downgrade compatibility; use outcome and app.active_deployment"
      indexed: true

    deployed_by:
      type: component
      doc: Information about who initiated the deployment
      attrs:
        user_id:
          type: string
          doc: "[DEPRECATED] Caller-supplied user ID retained for compatibility"
        user_name:
          type: string
          doc: "[DEPRECATED] Caller-supplied username retained for compatibility"
        user_email:
          type: string
          doc: "[DEPRECATED] Caller-supplied email retained for compatibility"
        timestamp:
          type: string
          doc: "[DEPRECATED] RFC3339 start time retained for compatibility; use started_at"
        subject:
          type: string
          doc: Stable subject from the server-authenticated RPC identity
        auth_method:
          type: string
          doc: Authentication method used by the initiating subject

    error_message:
      type: string
      doc: "[DEPRECATED] Bounded failure summary retained until lifecycle errors are queryable from the log stream"

    source_deployment_id:
      type: string
      doc: "[DEPRECATED] Lineage ID retained for downgrade compatibility; use parent_deployment"

    git_info:
      type: component
      doc: "[DEPRECATED] Build provenance retained for compatibility; stable source identity lives on AppVersion.source"
      attrs:
        sha:
          type: string
          doc: Git commit SHA
        branch:
          type: string
          doc: Git branch name
        message:
          type: string
          doc: Git commit message
        author:
          type: string
          doc: Git commit author
        is_dirty:
          type: bool
          doc: Whether working tree had uncommitted changes
        working_tree_hash:
          type: string
          doc: Hash of working tree if dirty
        commit_author_email:
          type: string
          doc: Git commit author email address
        commit_timestamp:
          type: string
          doc: Git commit timestamp in RFC3339 format
        repository:
          type: string
          doc: Git repository remote URL

  config_version:
    app:
      type: ref
      doc: The application this config version belongs to
      indexed: true
      tags: [dev.miren.app_ref]

    spec:
      type: config_spec
      doc: The configuration specification

  oidc_binding:
    app:
      type: ref
      doc: The application this OIDC binding is for
      indexed: true
      tags: [dev.miren.app_ref]

    provider:
      type: string
      doc: The OIDC provider type (github, gitlab, generic)

    issuer:
      type: string
      doc: The OIDC issuer URL (e.g. https://token.actions.githubusercontent.com)
      indexed: true

    subject_pattern:
      type: string
      doc: Glob pattern to match the token subject claim (e.g. repo:acme/web-app:*)

    claim_conditions:
      type: component
      doc: Additional claim conditions that must all match
      many: true
      attrs:
        key:
          type: string
          doc: The claim name to match (e.g. event_name)
        pattern:
          type: string
          doc: Glob pattern for the claim value (e.g. push,workflow_dispatch)

    description:
      type: string
      doc: Human-readable description of this binding

  # A secret's stable identity. Mutable metadata only — the value lives in the
  # immutable secret_version rows this points at, so nothing sensitive is here.
  secret:
    path:
      type: string
      doc: Backend-relative path, e.g. "payments/stripe-key"
      indexed: true

    current_version:
      type: ref
      doc: The version a floating (unpinned) reference resolves to. Moves on every write.

  # An immutable, envelope-encrypted payload. Never rewritten after creation.
  # The entity's built-in short id is the version handle used in references
  # (the "x1A" in "payments/stripe-key@x1A") — there is no explicit version field.
  secret_version:
    secret:
      type: ref
      doc: The secret this version belongs to
      indexed: true

    state:
      type: enum
      doc: Whether this version may still be resolved
      choices: [enabled, disabled, destroyed]
      indexed: true

    ciphertext:
      type: bytes
      doc: The value, encrypted with this version's data key (DEK)

    wrapped_dek:
      type: bytes
      doc: The DEK, encrypted (wrapped) by one of the cluster's KEKs — see kek_id

    kek_id:
      type: string
      doc: Which of the cluster's KEKs wrapped this DEK. A resolve unwraps with it; a key rotation re-wraps rows still pointing at a retiring key.
      indexed: true

    value_mac:
      type: string
      doc: Keyed hash (HMAC) of the plaintext under the cluster key, so a write can recognize an identical existing version without decrypting. Keyed rather than a bare digest so storing it never hands an attacker a rainbow-table oracle for the plaintext.
      indexed: true

  # A cluster-key rotation in flight. Modeled as an entity rather than an
  # in-process routine so it survives a coordinator restart, and so the
  # automatic trigger and the operator command drive one code path.
  key_rotation:
    from_key:
      type: string
      doc: The key being retired. Versions still wrapped by it are what the backfill moves.
      indexed: true

    to_key:
      type: string
      doc: The key being rotated to, already persisted and current before this record exists

    status:
      type: enum
      doc: rewrapping | retiring | done | failed
      choices: [rewrapping, retiring, done, failed]
      indexed: true

    rewrapped:
      type: int
      doc: Versions moved so far, for progress reporting only — the backfill's real state is the kek_id query

    error_message:
      type: string
      doc: Why the rotation stopped, when status is failed

components:
  config_spec:
    variables:
      type: component
      doc: Environment variables and configuration values
      many: true
      attrs:
        key:
          type: string
          doc: The name of the variable
        value:
          type: string
          doc: The value of the variable
        sensitive:
          type: bool
          doc: Whether or not the value is sensitive
        source:
          type: string
          doc: The source of the variable (config or manual). Defaults to config for backward compatibility.
        backend:
          type: string
          doc: Where the value comes from. Empty means value holds an inline literal; any other name refers to a registered secret backend instance (e.g. cluster) and value holds a backend-relative reference, optionally pinned with @version.
        required:
          type: bool
          doc: Whether this variable must have a non-empty value for deploy to succeed
        description:
          type: string
          doc: Human-readable description of this variable's purpose
    services:
      type: component
      doc: Per-service configuration
      many: true
      attrs:
        name:
          type: string
          doc: The service name (e.g. web, worker)
        command:
          type: string
          doc: The command to run for the service
        args:
          type: string
          many: true
          doc: Arguments that replace the image CMD while preserving its ENTRYPOINT
        port:
          type: int
          doc: The TCP port the service listens on
        port_name:
          type: string
          doc: The name of the port (e.g. http, grpc)
        port_type:
          type: string
          doc: The type of the port (e.g. http, tcp)
        port_timeout:
          type: string
          doc: Custom port-wait timeout (e.g. "60s", "2m"). Empty falls back to the 15s default; invalid duration strings are rejected at parse time.
        metrics:
          type: component
          doc: Prometheus scrape endpoint for this service
          attrs:
            enabled:
              type: bool
              doc: Whether the runtime should scrape this service
            path:
              type: string
              doc: HTTP path to scrape
            port:
              type: int
              doc: Declared TCP service port to scrape
            interval:
              type: string
              doc: Interval between scrapes
            public:
              type: bool
              doc: Whether public ingress may serve the metrics path
        ports:
          type: component
          doc: Network ports this service listens on. Overrides scalar port/port_name/port_type.
          many: true
          attrs:
            port:
              type: int
              required: true
            name:
              type: string
              required: true
            protocol:
              type: enum
              choices: [tcp, udp]
            type:
              type: string
            node_port:
              type: int
        image:
          type: string
          doc: Optional container image for this service
        env:
          type: component
          doc: Environment variables for this service only
          many: true
          attrs:
            key:
              type: string
              doc: The name of the variable
            value:
              type: string
              doc: The value of the variable
            sensitive:
              type: bool
              doc: Whether or not the value is sensitive
            source:
              type: string
              doc: The source of the variable (config or manual). Defaults to config for backward compatibility.
            backend:
              type: string
              doc: Where the value comes from. Empty means value holds an inline literal; any other name refers to a registered secret backend instance (e.g. cluster) and value holds a backend-relative reference, optionally pinned with @version.
            required:
              type: bool
              doc: Whether this variable must have a non-empty value for deploy to succeed
            description:
              type: string
              doc: Human-readable description of this variable's purpose
        concurrency:
          type: component
          doc: Concurrency configuration for this service
          attrs:
            mode:
              type: string
              doc: The concurrency mode (auto or fixed)
            requests_per_instance:
              type: int
              doc: For auto mode, number of concurrent requests per instance
            scale_down_delay:
              type: string
              doc: For auto mode, delay before scaling down idle instances
            num_instances:
              type: int
              doc: For fixed mode, number of instances to maintain
            shutdown_timeout:
              type: string
              doc: Time to wait for graceful shutdown before force-killing
        disks:
          type: component
          doc: Disk attachments for this service
          many: true
          attrs:
            name:
              type: string
              doc: The name of the disk
            provider:
              type: enum
              choices: [miren, local, sqlite]
              doc: "Disk provider: 'miren' (default) for network disks, 'local' for node-local persistent storage, 'sqlite' for a node-local SQLite database replicated to the coordinator"
            mount_path:
              type: string
              doc: The path inside the container where the disk will be mounted
            read_only:
              type: bool
              doc: Whether to mount the disk as read-only
            size_gb:
              type: int
              doc: Size in GB for auto-creating the disk if it doesn't exist
            filesystem:
              type: string
              doc: Filesystem type (ext4, xfs, btrfs) for auto-creating the disk
            db_file:
              type: string
              doc: Database filename inside the disk directory, for sqlite disks only; a bare filename, not a path (defaults to data.db)
            sqlite_id:
              type: string
              doc: Identity of the database a sqlite disk attaches to, scoped to the app (defaults to "default")
            source:
              type: string
              doc: Where this disk came from. Empty or "config" means the user declared it; "addon" means an addon contributed it and owns its removal.
            lease_timeout:
              type: string
              doc: Timeout for acquiring the disk lease
            owner:
              type: string
              doc: >-
                Ownership policy for the mounted disk. Empty (default) makes the
                disk writable by the container's run user; "keep" leaves the raw
                mount ownership untouched; "uid" or "uid:gid" pins a specific
                numeric owner.
    tasks:
      type: component
      doc: >-
        Per-task configuration. A task is a command the platform knows how to
        run, as opposed to a service, which is a process it keeps up. Tasks
        carry no ports, concurrency, image, or disks: a task always runs in the
        app's image, and both per-task image and per-task disks are deliberate
        v1 cuts tracked in RFD-97.
      many: true
      attrs:
        name:
          type: string
          doc: The task name (e.g. migrate, cleanup)
        command:
          type: string
          doc: >-
            The default command to run. An invoke can override it, which is what
            makes a manually-triggered task useful for ad-hoc work.
        trigger:
          type: string
          doc: >-
            What starts the task: "deploy" (a new version is deployed, before it
            takes traffic), "schedule" (a calendar expression comes due), or
            "manual" (only when someone asks). Defaults to manual.
        schedule:
          type: string
          doc: >-
            The systemd OnCalendar expression this task fires on. An `every`
            interval in app.toml is desugared into this form at parse time, so
            there is exactly one scheduling mechanism and this is always the
            stored representation.
        timeout:
          type: string
          doc: >-
            Bounds the run, after which the sandbox is killed and the run is
            marked TIMED_OUT. Empty falls back to the platform default; "0"
            means unbounded.
        retries:
          type: int
          doc: >-
            Retry budget for deploy- and schedule-triggered runs, where nobody
            is watching to retry by hand. A manually-triggered run that fails
            just fails.
        max_concurrent:
          type: int
          doc: >-
            Caps simultaneous runs of this task. Defaults to 1, where the limit
            is enforced exactly; above 1 admission is best-effort.
        env:
          type: component
          doc: Environment variables for this task only
          many: true
          attrs:
            key:
              type: string
              doc: The name of the variable
            value:
              type: string
              doc: The value of the variable
            sensitive:
              type: bool
              doc: Whether or not the value is sensitive
            source:
              type: string
              doc: The source of the variable (config or manual). Defaults to config for backward compatibility.
            origin:
              type: string
              doc: The provenance of the variable (user, file, generated, detected)
            required:
              type: bool
              doc: Whether this variable must have a non-empty value for deploy to succeed
            description:
              type: string
              doc: Human-readable description of this variable's purpose
    entrypoint:
      type: string
      doc: The container entrypoint command
    start_directory:
      type: string
      doc: Directory to start the process in; defaults to /app.
