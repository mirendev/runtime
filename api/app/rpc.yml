imports:
  standard:
    path: ../../pkg/rpc/standard/standard.yml
    import: miren.dev/runtime/pkg/rpc/standard
  stream:
    path: ../../pkg/rpc/stream/stream.yml
    import: miren.dev/runtime/pkg/rpc/stream

types:
  - type: LogTarget
    fields:
      - name: app
        type: string
        index: 0
        optional: true
      - name: sandbox
        type: string
        index: 1
        optional: true
      - name: system
        type: bool
        index: 2
        optional: true


  - type: AutoConcurrency
    fields:
      - name: factor
        type: int32
        index: 1

  - type: ServiceCommand
    fields:
      - name: service
        type: string
        index: 0
      - name: command
        type: string
        index: 1

  - type: ServiceConfig
    fields:
      - name: service
        type: string
        index: 0
      - name: service_env
        type: list
        element: NamedValue
        index: 1
      - name: concurrency_mode
        type: string
        index: 2
      - name: num_instances
        type: int32
        index: 3

  - type: Configuration
    fields:
      - name: env_vars
        type: list
        element: NamedValue
        index: 0
      - name: concurrency
        type: int32
        index: 1
      - name: auto_concurrency
        type: AutoConcurrency
        index: 2
      - name: commands
        type: list
        element: ServiceCommand
        index: 3
      - name: entrypoint
        type: string
        index: 4
        doc: "Prefixed to all commands run in the container"
      - name: services
        type: list
        element: ServiceConfig
        index: 5
        doc: "Per-service configuration including environment variables"

  - type: NamedValue
    fields:
      - name: key
        type: string
        index: 0
      - name: value
        type: string
        index: 1
      - name: sensitive
        type: bool
        index: 2
      - name: source
        type: string
        index: 3
      - name: required
        type: bool
        index: 4
      - name: description
        type: string
        index: 5

  - type: VersionInfo
    fields:
      - name: version
        type: string
        index: 0
      - name: created_at
        type: standard.Timestamp
        index: 1
      - name: short_id
        type: string
        index: 2
        doc: Short human-friendly ID for the app version

  - type: AppInfo
    fields:
      - name: name
        type: string
        index: 0
      - name: created_at
        type: standard.Timestamp
        index: 1
      - name: current_version
        type: VersionInfo
        index: 2
      - name: health
        type: string
        index: 3
      - name: ready_instances
        type: int32
        index: 4
      - name: desired_instances
        type: int32
        index: 5
      - name: scaling_mode
        type: string
        index: 6
      - name: routes
        type: list
        element: string
        index: 7
      - name: crash_count
        type: int64
        index: 8
      - name: cooldown_seconds
        type: int32
        index: 9

  - type: CpuUsage
    fields:
      - name: start
        type: standard.Timestamp
        index: 0
      - name: cores
        type: float64
        index: 1

  - type: MemoryUsage
    fields:
      - name: timestamp
        type: standard.Timestamp
        index: 0
      - name: bytes
        type: int64
        index: 1

  - type: RequestStat
    fields:
      - name: timestamp
        type: standard.Timestamp
        index: 0
      - name: count
        type: int64
        index: 1
        doc: "Number of requests in this time window"
      - name: avgDurationMs
        type: float64
        index: 2
        doc: "Average request duration in milliseconds"
      - name: errorRate
        type: float64
        index: 3
        doc: "Percentage of requests that resulted in errors (4xx/5xx)"
      - name: p95DurationMs
        type: float64
        index: 4
        doc: "95th percentile request duration in milliseconds"
      - name: p99DurationMs
        type: float64
        index: 5
        doc: "99th percentile request duration in milliseconds"

  - type: PathStat
    fields:
      - name: path
        type: string
        index: 0
        doc: "The request path"
      - name: count
        type: int64
        index: 1
        doc: "Number of requests to this path"
      - name: avgDurationMs
        type: float64
        index: 2
        doc: "Average response time for this path"
      - name: errorRate
        type: float64
        index: 3
        doc: "Error rate for this path"

  - type: ErrorBreakdown
    fields:
      - name: statusCode
        type: int32
        index: 0
        doc: "HTTP status code (4xx or 5xx)"
      - name: count
        type: int64
        index: 1
        doc: "Number of requests with this status code"
      - name: percentage
        type: float64
        index: 2
        doc: "Percentage of total errors"

  - type: BoundPort
    fields:
      - name: port
        type: int64
        index: 0
        doc: "The port the app actually bound"
      - name: address
        type: string
        index: 1
        doc: "The listening address, when not the default"

  - type: PoolStatus
    fields:
      - name: name
        type: string
        index: 0
      - name: windows
        type: list
        element: "*WindowStatus"
        index: 1
      - name: idle
        type: int32
        index: 2
      - name: idleUsage
        type: int64
        index: 3

  - type: WindowStatus
    fields:
      - name: version
        type: string
        index: 0
      - name: leases
        type: int32
        index: 1
      - name: usage
        type: int64
        index: 2

  - type: ApplicationStatus
    fields:
      - name: name
        type: string
        index: 0
      - name: pools
        type: list
        element: "*PoolStatus"
        index: 1
      - name: lastMinCPU
        type: float64
        index: 2
      - name: lastHourCPU
        type: float64
        index: 3
      - name: lastDayCPU
        type: float64
        index: 4
      - name: cpuOverHour
        type: list
        element: '*CpuUsage'
        index: 5
      - name: memoryOverHour
        type: list
        element: '*MemoryUsage'
        index: 6
      - name: activeVersion
        type: string
        index: 7
      - name: lastDeploy
        type: standard.Timestamp
        index: 8
      - name: addons
        type: list
        element: AddonInstance
        index: 9
      - name: requestsPerSecond
        type: float64
        index: 10
        doc: "Current requests per second (last minute average)"
      - name: requestStats
        type: list
        element: '*RequestStat'
        index: 11
        doc: "Request statistics over the last hour"
      - name: topPaths
        type: list
        element: '*PathStat'
        index: 12
        doc: "Most frequently accessed paths"
      - name: errorBreakdown
        type: list
        element: '*ErrorBreakdown'
        index: 13
        doc: "Breakdown of errors by HTTP status code"
      - name: health
        type: string
        index: 14
        doc: "Readiness of the active version derived from pool state: healthy, degraded, starting, crashed, idle, or unknown"
      - name: readyInstances
        type: int32
        index: 15
        doc: "Number of instances of the active version that are RUNNING and serving"
      - name: desiredInstances
        type: int32
        index: 16
        doc: "Number of instances the active version's pools want running"
      - name: crashCount
        type: int64
        index: 17
        doc: "Consecutive crash count when the active version is in cooldown"
      - name: cooldownSeconds
        type: int32
        index: 18
        doc: "Seconds remaining in crash cooldown, when crashed"
      - name: boundPorts
        type: list
        element: '*BoundPort'
        index: 19
        doc: "Ports the active version's instances actually bound that diverge from the configured port"

  - type: LogEntry
    fields:
      - name: timestamp
        type: standard.Timestamp
        index: 0
      - name: line
        type: string
        index: 1
      - name: stream
        type: string
        index: 2
      - name: source
        type: string
        index: 3
      - name: attributes
        type: map
        key: string
        value: string
        index: 4

  - type: LogChunk
    fields:
      - name: entries
        type: list
        element: "*LogEntry"
        index: 0

  - type: UserInfo
    fields:
      - name: subject
        type: string

  - type: DiskConfig
    fields:
      - name: id
        type: string
        index: 0
      - name: name
        type: string
        index: 1
      - name: capacity
        type: int64
        index: 2

  - type: AddonInstance
    fields:
      - name: id
        type: string
        index: 0
      - name: name
        type: string
        index: 1
      - name: addon
        type: string
        index: 2
      - name: variant
        type: string
        index: 3
      - name: version
        type: string
        index: 4

interfaces:
  - name: Crud
    http:
      prefix: /api/v1
    methods:
      - name: new
        http:
          post: /apps
          body: "*"
        parameters:
          - name: name
            type: string
        results:
          - name: id
            type: string
      - name: setConfiguration
        http:
          put: /apps/{app}/config
          body: "*"
        parameters:
          - name: app
            type: string
          - name: configuration
            type: Configuration
        results:
          - name: versionId
            type: string
          - name: versionShortId
            type: string
      - name: getConfiguration
        http:
          get: /apps/{app}/config
        parameters:
          - name: app
            type: string
        results:
          - name: configuration
            type: Configuration
          - name: versionId
            type: string
          - name: versionShortId
            type: string
      - name: setHost
        http:
          put: /apps/{app}/host
          body: "*"
        parameters:
          - name: app
            type: string
          - name: host
            type: string
      - name: list
        http:
          get: /apps
        results:
          - name: apps
            type: list
            element: AppInfo
      - name: destroy
        http:
          delete: /apps/{name}
        parameters:
          - name: name
            type: string
      - name: setEnvVar
        http:
          put: /apps/{app}/env/{key}
          body: "*"
        parameters:
          - name: app
            type: string
          - name: key
            type: string
          - name: value
            type: string
          - name: sensitive
            type: bool
          - name: service
            type: string
            doc: "Optional service name for per-service env vars. Empty means global."
        results:
          - name: versionId
            type: string
          - name: versionShortId
            type: string
      - name: setEnvVars
        http:
          put: /apps/{app}/env
          body: "*"
        parameters:
          - name: app
            type: string
          - name: vars
            type: list
            element: NamedValue
          - name: service
            type: string
            doc: "Optional service name for per-service env vars. Empty means global."
        results:
          - name: versionId
            type: string
          - name: versionShortId
            type: string
      - name: setInitialEnvVars
        doc: |
          Set env vars on the app's initial ConfigVersion. Used during
          `miren init` to stage config (including server-side secrets) before
          the first build. Creates a ConfigVersion entity and points the app's
          initial_config field at it; does not create an AppVersion or
          activate one. The first deploy seeds its config from this entity.
        parameters:
          - name: app
            type: string
          - name: vars
            type: list
            element: NamedValue
          - name: service
            type: string
            doc: "Optional service name for per-service env vars. Empty means global."
        http:
          post: /apps/{app}/initial-env
          body: "*"
        results:
          - name: configVersionId
            type: string
      - name: deleteEnvVar
        http:
          delete: /apps/{app}/env/{key}
        parameters:
          - name: app
            type: string
          - name: key
            type: string
          - name: service
            type: string
            doc: "Optional service name for per-service env vars. Empty means global."
        results:
          - name: versionId
            type: string
          - name: versionShortId
            type: string
          - name: deletedSource
            type: string
            doc: "The source of the deleted variable (config or manual)"
      - name: restart
        http:
          post: /apps/{app}/restart
          body: "*"
        parameters:
          - name: app
            type: string
          - name: service
            type: string
            doc: "Optional service name to restart only a specific service. Empty restarts all services."
        results:
          - name: restarted_pools
            type: int32
          - name: stopped_sandboxes
            type: int32

  - name: UserQuery
    methods:
      - name: whoAmI
        results:
          - name: info
            type: UserInfo

  - name: AppStatus
    http:
      prefix: /api/v1
    methods:
      - name: appInfo
        http:
          get: /apps/{application}/status
        parameters:
          - name: application
            type: string
        results:
          - name: status
            type: ApplicationStatus

  - name: Logs
    http:
      prefix: /api/v1
    methods:
      - name: appLogs
        http:
          get: /apps/{application}/logs
        parameters:
          - name: application
            type: string
          - name: from
            type: standard.Timestamp
          - name: follow
            type: bool
        results:
          - name: logs
            type: list
            element: LogEntry
      - name: sandboxLogs
        http:
          get: /sandboxes/{sandbox}/logs
        parameters:
          - name: sandbox
            type: string
          - name: from
            type: standard.Timestamp
          - name: follow
            type: bool
        results:
          - name: logs
            type: list
            element: LogEntry
      - name: streamLogs
        parameters:
          - name: target
            type: LogTarget
          - name: from
            type: standard.Timestamp
          - name: follow
            type: bool
          - name: logs
            type: stream.SendStream[*LogEntry]
      - name: streamLogChunks
        parameters:
          - name: target
            type: LogTarget
          - name: from
            type: standard.Timestamp
          - name: follow
            type: bool
          - name: filter
            type: string
            doc: "Optional regex pattern to filter log lines"
          - name: chunks
            type: stream.SendStream[*LogChunk]
          - name: to
            type: standard.Timestamp
            doc: "Optional upper time bound; when unset, reads up to now"

  - name: Disks
    http:
      prefix: /api/v1
    methods:
      - name: new
        http:
          post: /disks
          body: "*"
        parameters:
          - name: name
            type: string
          - name: capacity
            type: int64
        results:
          - name: id
            type: string
      - name: getById
        http:
          get: /disks/{id}
        parameters:
          - name: id
            type: string
        results:
          - name: config
            type: DiskConfig
      - name: getByName
        http:
          get: /disks/by-name/{name}
        parameters:
          - name: name
            type: string
        results:
          - name: config
            type: DiskConfig
      - name: list
        http:
          get: /disks
        results:
          - name: disks
            type: list
            element: DiskConfig
      - name: delete
        http:
          delete: /disks/{id}
        parameters:
          - name: id
            type: string

  - name: Addons
    http:
      prefix: /api/v1
    methods:
      - name: createInstance
        http:
          post: /apps/{app}/addons
          body: "*"
        parameters:
          - name: name
            type: string
          - name: addon
            type: string
          - name: variant
            type: string
          - name: app
            type: string
          - name: version
            type: string
        results:
          - name: id
            type: string

      - name: listInstances
        http:
          get: /apps/{app}/addons
        parameters:
          - name: app
            type: string
        results:
          - name: addons
            type: list
            element: AddonInstance

      - name: rotateCredential
        http:
          post: /apps/{app}/addons/{name}/rotate
          body: "*"
        parameters:
          - name: app
            type: string
          - name: name
            type: string
          - name: credential
            type: string
        results:
          - name: id
            type: string

      - name: deleteInstance
        http:
          delete: /apps/{app}/addons/{name}
        parameters:
          - name: app
            type: string
          - name: name
            type: string
