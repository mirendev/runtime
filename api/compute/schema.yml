domain: dev.miren.compute
version: v1alpha

components:
  # Immutable build-time sandbox configuration
  # Shared between Sandbox (as spec field) and SandboxPool (as template)
  sandbox_spec:
    version:
      type: ref
      doc: Application version reference
      indexed: true

    logEntity:
      type: string
      doc: Entity to associate log output with

    logAttribute:
      type: label
      doc: Labels for log entries
      many: true

    hostNetwork:
      type: bool
      doc: Whether to use host networking

    port_wait_timeout:
      type: string
      doc: |
        Max time to wait for declared container ports to bind before marking
        the sandbox DEAD. Parsed via time.ParseDuration (e.g. "60s"). Empty,
        invalid, or non-positive values (including "0s") fall back to 15s.
        Addons with slow cold-init (e.g. MySQL first-boot ~20s) should set
        this to a larger value.

    restart_policy:
      type: enum
      choices: [always, never]
      doc: |
        Whether the sandbox controller may reboot this sandbox's containers if
        they have disappeared while the entity still reads RUNNING. Empty means
        "always", which is the historical behavior every service depends on.

        "never" is required for sandboxes backing a task run, whose command
        must execute at most once. Without it a run that loses its containers
        without the exit being observed -- a runner restart mid-run is the
        realistic case -- gets its command re-executed on the next reconcile,
        which for a migration is not a recoverable mistake.

    route:
      type: component
      doc: Network route configuration
      many: true
      attrs:
        destination:
          type: string
          doc: Network destination
        gateway:
          type: string
          doc: Next hop for destination

    volume:
      type: component
      doc: Volume configuration
      many: true
      attrs:
        name:
          type: string
          doc: Volume name
        provider:
          type: string
          doc: Volume provider
        labels:
          type: label
          doc: Labels identifying the volume
          many: true
        # Disk-specific configuration (when provider="miren")
        disk_name:
          type: string
          doc: Name of the disk to attach (for disk provider)
        mount_path:
          type: string
          doc: Path where disk should be mounted (for disk provider)
        read_only:
          type: bool
          doc: Whether to mount disk as read-only (for disk provider)
        size_gb:
          type: int
          doc: Disk size in GB for auto-creation (for disk provider)
        filesystem:
          type: string
          doc: Filesystem type for auto-creation (for disk provider)
        lease_timeout:
          type: string
          doc: Timeout for acquiring disk lease (for disk provider)
        owner:
          type: string
          doc: >-
            Ownership policy for the mounted disk (for disk provider). Empty
            derives the owner from the container's resolved run user; "keep"
            leaves the raw mount ownership untouched; "uid" or "uid:gid" pins a
            specific numeric owner.

    static_host:
      type: component
      doc: Static host-to-IP mapping
      many: true
      attrs:
        host:
          type: string
          doc: Hostname
        ip:
          type: string
          doc: IP address

    container:
      type: component
      doc: Container specification
      many: true
      required: true
      attrs:
        image:
          type: string
          doc: Container image
          required: true
        name:
          type: string
          doc: Container name
        privileged:
          type: bool
          doc: Whether container runs in privileged mode
        tty:
          type: bool
          doc: Allocate a TTY for the container
        stdin:
          type: bool
          doc: Keep stdin open for the container
        command:
          type: string
          doc: Command to run
        directory:
          type: string
          doc: Working directory
        env:
          type: string
          doc: Environment variable
          many: true
        port:
          type: component
          doc: Network port declaration
          many: true
          attrs:
            port:
              type: int
              doc: Port number
              required: true
            name:
              type: string
              doc: Port name
              required: true
            protocol:
              type: enum
              doc: Port protocol
              choices: [tcp, udp]
            type:
              type: string
              doc: High-level port type (e.g., http)
            node_port:
              type: int
              doc: The port number that should be forwarded from the node to the container
        mount:
          type: component
          doc: Mounted directory
          many: true
          attrs:
            source:
              type: string
              doc: Mount source path
            destination:
              type: string
              doc: Mount destination path
        oom_score:
          type: int
          doc: OOM score adjustment
        config_file:
          type: component
          doc: File to write into container
          many: true
          attrs:
            path:
              type: string
              doc: File path in container
            data:
              type: string
              doc: File contents
            mode:
              type: string
              doc: File mode
        shutdown_timeout:
          type: string
          doc: Time to wait for graceful shutdown before force-killing (e.g. 10s, 30s)

kinds:
  sandbox:
    # Runtime fields
    status:
      type: enum
      doc: The status of the pod
      choices: [pending, not_ready, running, stopped, dead]

    last_activity:
      type: time
      doc: Last lease activity (throttled updates, ~30s granularity for scale-down)

    # Written once, in the same patch as the STOPPED transition, so any watcher
    # that sees the sandbox stop also sees why.
    #
    # This is a component rather than a top-level `exit_code` int because
    # `required: true` would make the generated Encode() emit the attribute
    # unconditionally, and several sites patch Sandbox by struct literal to
    # change only Status -- each of those would stamp exit_code=0 over the real
    # value. A singular component is skipped entirely when empty, while
    # `required` on the inner code makes a legitimate 0 encode.
    exit:
      type: component
      doc: Terminal result of the sandbox's primary container task; absent until it exits
      attrs:
        code:
          type: int
          required: true
          doc: Process exit code. Required so a legitimate 0 survives encoding.
        at:
          type: time
          doc: |
            When the task exited. Always set when the component is written:
            an Exit with a zero code and a zero time is indistinguishable from
            an absent one, and would be dropped.
        container:
          type: string
          doc: Name of the container whose task exited

    # Network is runtime field (address allocated by controller)
    network:
      type: component
      doc: Network accessability for the container
      many: true
      attrs:
        address:
          doc: A network address to reach the container at
          type: string
        subnet:
          doc: The subnet that the address is associated with
          type: string

    # Observed at startup: the port the app actually bound. Set only when it
    # diverges from the configured port (the app ignored $PORT), so routing and
    # health-checking can target the real port instead of the configured one.
    bound_port:
      type: component
      doc: Port the container was observed listening on, set only when it differs from the configured port
      many: true
      attrs:
        port:
          doc: The observed listening port
          type: int
        address:
          doc: The bind address the port was observed on
          type: string

    # Legacy fields - kept for backward compatibility with existing sandboxes
    # New sandboxes should use spec field instead
    labels:
      type: string
      doc: Label for the sandbox
      many: true

    hostNetwork:
      type: bool
      doc: |
        Indicates if the container should use the networking of
        node that it is running on directly

    logEntity:
      type: string
      doc: The entity to associate the log output of the sandbox with

    logAttribute:
      type: label
      doc: Labels that will be associated with the log entries generated by the sandbox
      many: true

    route:
      type: component
      doc: A network route the container uses
      many: true
      attrs:
        destination:
          doc: The network destination
          type: string
        gateway:
          doc: The next hop for the destination
          type: string

    volume:
      type: component
      doc: A volume that is available for binding into containers
      many: true
      attrs:
        name:
          type: string
          doc: The name of the volume
        provider:
          type: string
          doc: What provider should provide the volume
        labels:
          type: label
          doc: Labels that identify the volume to the provider
          many: true

    static_host:
      type: component
      doc: A name to ip mapping configured staticly for the sandbox
      many: true
      attrs:
        host:
          type: string
          doc: The hostname
        ip:
          type: string
          doc: The IP

    container:
      type: component
      doc: A container running in the sandbox
      many: true
      required: true
      attrs:
        image:
          type: string
          doc: Container image
          required: true
        name:
          type: string
          doc: Container name
        privileged:
          type: bool
          doc: Whether or not the container runs in privileged mode
        tty:
          type: bool
          doc: Allocate a TTY for the container
        stdin:
          type: bool
          doc: Keep stdin open for the container
        command:
          type: string
          doc: Command to run in the container
        directory:
          type: string
          doc: Directory to start in
        env:
          type: string
          doc: Environment variable for the container
          many: true

        port:
          type: component
          doc: A network port the container declares
          many: true
          attrs:
            port:
              type: int
              doc: Port number
              required: true
            name:
              type: string
              doc: Name of the port for reference
              required: true
            protocol:
              type: enum
              doc: Port protocol
              choices: [tcp, udp]
            type:
              type: string
              doc: The highlevel type of the port
              example: http
            node_port:
              type: int
              doc: The port number that should be forwarded from the node to the container

        mount:
          type: component
          doc: A mounted directory
          many: true
          attrs:
            source:
              type: string
              doc: Mount source path
            destination:
              type: string
              doc: Mount destination path

        oom_score:
          type: int
          doc: How to adjust the OOM score for this container

        config_file:
          type: component
          doc: A file to write into the container before starting
          many: true
          attrs:
            path:
              type: string
              doc: The path in the container to write the data
            data:
              type: string
              doc: The configuration data
            mode:
              type: string
              doc: The file mode to set the configuration to

        shutdown_timeout:
          type: string
          doc: Time to wait for graceful shutdown before force-killing (e.g. 10s, 30s)

    # Immutable config - reference to standalone component (for new sandboxes)
    spec:
      type: sandbox_spec
      doc: Immutable sandbox configuration

  sandbox_pool:
    app:
      type: ref
      doc: Reference to the app this pool belongs to
      indexed: true
      tags: [dev.miren.app_ref]

    service:
      type: string
      doc: Service name (e.g., web, worker) - pool identifier
      indexed: true

    # Template for creating sandboxes - references same component as sandbox.spec
    sandbox_spec:
      type: sandbox_spec
      doc: Complete sandbox specification template (includes version ref to AppVersion)

    # Labels to apply to sandboxes created from this pool
    sandbox_labels:
      type: label
      doc: Labels that will be added to the metadata of sandboxes created from this pool
      many: true

    # Prefix for sandbox entity names created from this pool
    sandbox_prefix:
      type: string
      doc: Prefix used when generating sandbox entity names (e.g., "myapp-web" produces "myapp-web-abc123")

    # Desired state (managed by Activator based on traffic demand)
    desired_instances:
      type: int
      doc: Target number of sandbox instances

    # Observable state (maintained by SandboxPoolManager)
    current_instances:
      type: int
      doc: Current number of sandbox instances (non-STOPPED)

    ready_instances:
      type: int
      doc: Number of RUNNING sandboxes

    # Crash loop detection and cooldown (managed by SandboxPoolManager)
    consecutive_crash_count:
      type: int
      doc: Number of consecutive quick crashes (sandboxes that died within 60s of creation)

    last_crash_time:
      type: time
      doc: Timestamp of the most recent quick crash

    cooldown_until:
      type: time
      doc: Timestamp until which new sandbox creation is paused due to crash loop

    # Version references for pool reuse across deployments
    referenced_by_versions:
      type: ref
      doc: AppVersions that reference this pool (enables reuse when specs match)
      many: true
      indexed: true

    ephemeral:
      type: bool
      doc: True when this pool backs an ephemeral AppVersion. Ephemeral pools never scale beyond 1 instance.

  node:
    constraints:
      type: label
      doc: The label constraints the node has, used for scheduling
      many: true

    status:
      type: enum
      doc: The status of the node
      choices: [unknown, ready, disabled, unhealthy]
      session: true

    api_address:
      type: string
      doc: The address to connect the node at

    runner_id:
      type: string
      doc: Unique identifier for the runner (for distributed runners)
      indexed: true

    name:
      type: string
      doc: Human-readable name for the runner (defaults to hostname)

    version:
      type: string
      doc: Runner software version

    registered_at:
      type: time
      doc: When the runner first registered with the coordinator

    scheduling:
      type: enum
      doc: |
        Operator-controlled scheduling eligibility for the node. Unlike status
        (which is session-scoped and reset to ready on every runner rejoin),
        scheduling is persistent, so a cordoned node stays unschedulable across
        runner restarts until an operator uncordons it. The zero value (unset)
        is treated as schedulable. A future "draining" value can be added here
        when drain becomes asynchronous.
      choices: [schedulable, cordoned]

  schedule:
    key:
      type: component
      doc: The scheduling key for an entity
      indexed: true
      attrs:
        node:
          type: ref
          doc: The node id the entity is scheduled for
        kind:
          type: ref
          doc: The type of entity this is

  lease:
    project:
      type: ref
      doc: Which project currently holds the lease
      indexed: true
    sandbox:
      type: ref
      doc: The sandbox that is leased
      indexed: true
    last_heartbeat:
      type: time
      doc: The last time the lease was updated

