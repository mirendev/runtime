domain: dev.miren.addon
version: v1alpha
kinds:
  addon:
    name:
      type: string
      indexed: true
    display_name:
      type: string
    description:
      type: string
    default_variant:
      type: string
    default_version:
      type: string
    locality_mode:
      type: string
    variants:
      type: component
      many: true
      attrs:
        name:
          type: string
        description:
          type: string
        details:
          type: component
          many: true
          attrs:
            key:
              type: string
            value:
              type: string

  addon_association:
    app:
      type: ref
      indexed: true
      tags: [dev.miren.app_ref]
    addon:
      type: ref
      indexed: true
    variant:
      type: string
    version:
      type: string
    status:
      type: string
      indexed: true
    error_message:
      type: string
    variables:
      type: component
      many: true
      attrs:
        key:
          type: string
        value:
          type: string
        sensitive:
          type: bool
    # Storage an InApp addon supplies, held here for the same reason variables
    # are: the binding follows the app rather than a version, so it survives
    # deploys and rollbacks of versions that were built without it.
    # ResolveRuntimeConfig reads these and attaches them to the app's services.
    disks:
      type: component
      many: true
      attrs:
        name:
          type: string
          doc: Disk name within a service's spec
        provider:
          type: string
          doc: Volume provider (see controllers/sandbox/volume.go)
        mount_path:
          type: string
          doc: Where the disk appears inside the container
        db_file:
          type: string
          doc: Database filename within the mounted directory, for providers that manage one
        requires_single_writer:
          type: bool
          doc: Storage only one process may write, so a receiving service must run a single fixed instance
    # Services the addon's disks attach to. Empty means every service, matching
    # how addon variables reach every service.
    services:
      type: string
      many: true

  # rotation_request drives a one-shot credential rotation for the addon server
  # backing an association. The RPC creates one with status "pending"; the
  # rotation controller reconciles it: apply a new secret to the live engine,
  # update the stored value, and redeploy affected consumers.
  rotation_request:
    association:
      type: ref
      indexed: true
    addon:
      type: ref
    credential:
      type: string
    status:
      type: string
      indexed: true
    # new_secret is the target credential, generated and recorded once before any
    # engine change so a crashed rotation is recoverable: a retry reuses it rather
    # than minting a fresh secret it can no longer authenticate with. Cleared when
    # the request reaches "done".
    new_secret:
      type: string
    error_message:
      type: string

  postgres_server:
    addon_name:
      type: string
      indexed: true
    variant:
      type: string
    image:
      type: string
    sandbox_pool:
      type: ref
    service:
      type: ref
    status:
      type: string
    association_count:
      type: int
    superuser_password:
      type: string
    disk_name:
      type: string

  postgresql_shared_data:
    postgres_server:
      type: ref
    database_name:
      type: string
    username:
      type: string

  postgresql_dedicated_data:
    postgres_server:
      type: ref
    database_name:
      type: string
    username:
      type: string

  mysql_server:
    addon_name:
      type: string
      indexed: true
    variant:
      type: string
    image:
      type: string
    sandbox_pool:
      type: ref
    service:
      type: ref
    status:
      type: string
    association_count:
      type: int
    root_password:
      type: string
    disk_name:
      type: string

  mysql_shared_data:
    mysql_server:
      type: ref
    database_name:
      type: string
    username:
      type: string

  mysql_dedicated_data:
    mysql_server:
      type: ref
    database_name:
      type: string
    username:
      type: string

  valkey_server:
    addon_name:
      type: string
      indexed: true
    variant:
      type: string
    sandbox_pool:
      type: ref
    service:
      type: ref
    status:
      type: string
    association_count:
      type: int
    password:
      type: string

  valkey_dedicated_data:
    valkey_server:
      type: ref

  rabbitmq_server:
    addon_name:
      type: string
      indexed: true
    variant:
      type: string
    sandbox_pool:
      type: ref
    service:
      type: ref
    status:
      type: string
    association_count:
      type: int
    password:
      type: string

  rabbitmq_dedicated_data:
    rabbitmq_server:
      type: ref

  memcache_server:
    addon_name:
      type: string
      indexed: true
    variant:
      type: string
    sandbox_pool:
      type: ref
    service:
      type: ref
    status:
      type: string
    association_count:
      type: int

  memcache_dedicated_data:
    memcache_server:
      type: ref
