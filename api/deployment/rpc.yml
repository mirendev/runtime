name: deployment
version: v1alpha
doc: Service for managing deployment records

imports:
  standard:
    path: ../../pkg/rpc/standard/standard.yml
    import: miren.dev/runtime/pkg/rpc/standard

interfaces:
  - name: Deployment
    doc: Deployment management service
    methods:
      - name: CreateDeployment
        index: 0
        doc: >
          DEPRECATED: The build server now owns the deployment record lifecycle
          (see the build service DeployRequest). Retained so an older CLI still
          works against a newer server. Do not add new callers.
        parameters:
          - name: app_name
            type: string
            doc: The name of the application
          - name: cluster_id
            type: string
            doc: The cluster where deployment is happening
          - name: app_version_id
            type: string
            doc: The ID of the app version being deployed
          - name: git_info
            type: GitInfo
            doc: Git information at time of deployment (optional)
        results:
          - name: deployment
            type: DeploymentInfo
            doc: The created deployment
          - name: error
            type: string
            doc: Error message if deployment creation failed
          - name: lock_info
            type: DeploymentLockInfo
            doc: Structured information about the deployment lock (if blocked)

      - name: UpdateDeploymentStatus
        index: 1
        doc: >
          DEPRECATED: superseded by server-owned deployment lifecycle. Retained
          for older CLIs. Do not add new callers.
        parameters:
          - name: deployment_id
            type: string
            doc: The ID of the deployment to update
          - name: status
            type: string
            doc: New status (in_progress, active, failed, rolled_back)
          - name: error_message
            type: string
            doc: Error message if status is failed (optional)
        results:
          - name: deployment
            type: DeploymentInfo
            doc: The updated deployment

      - name: UpdateDeploymentPhase
        index: 2
        doc: >
          DEPRECATED: superseded by server-owned deployment lifecycle. Retained
          for older CLIs. Do not add new callers.
        parameters:
          - name: deployment_id
            type: string
            doc: The ID of the deployment to update
          - name: phase
            type: string
            doc: New phase (preparing, building, pushing, activating)
        results:
          - name: deployment
            type: DeploymentInfo
            doc: The updated deployment

      - name: UpdateFailedDeployment
        index: 3
        doc: >
          DEPRECATED: superseded by server-owned deployment lifecycle. Retained
          for older CLIs. Do not add new callers.
        parameters:
          - name: deployment_id
            type: string
            doc: The ID of the deployment to update
          - name: error_message
            type: string
            doc: Error message describing the failure
          - name: build_logs
            type: string
            doc: Build logs from the failed deployment
        results:
          - name: deployment
            type: DeploymentInfo
            doc: The updated deployment

      - name: UpdateDeploymentAppVersion
        index: 4
        doc: >
          DEPRECATED: superseded by server-owned deployment lifecycle. Retained
          for older CLIs. Do not add new callers.
        parameters:
          - name: deployment_id
            type: string
            doc: The ID of the deployment to update
          - name: app_version_id
            type: string
            doc: The actual app version ID created by the build
        results:
          - name: deployment
            type: DeploymentInfo
            doc: The updated deployment

      - name: ListDeployments
        index: 5
        doc: List deployments with optional filters
        parameters:
          - name: app_name
            type: string
            doc: Filter by application name (optional)
          - name: cluster_id
            type: string
            doc: Filter by cluster (optional)
          - name: status
            type: string
            doc: Filter by status (optional)
          - name: limit
            type: int32
            doc: Maximum number of results (optional)
        results:
          - name: deployments
            type: list
            element: DeploymentInfo
            doc: List of deployments

      - name: GetDeploymentById
        index: 6
        doc: Get a specific deployment by ID
        parameters:
          - name: deployment_id
            type: string
            doc: The deployment ID
        results:
          - name: deployment
            type: DeploymentInfo
            doc: The deployment details

      - name: GetActiveDeployment
        index: 7
        doc: Get the currently active deployment for an app/cluster
        parameters:
          - name: app_name
            type: string
            doc: The application name
          - name: cluster_id
            type: string
            doc: The cluster ID
        results:
          - name: deployment
            type: DeploymentInfo
            doc: The active deployment (if any)

      - name: CancelDeployment
        index: 8
        doc: Cancel an in-progress deployment
        parameters:
          - name: deployment_id
            type: string
            doc: The ID of the deployment to cancel
          - name: caller_user_id
            type: string
            doc: User ID of the caller (from JWT claims, empty if no auth)
        results:
          - name: success
            type: bool
            doc: Whether cancellation succeeded
          - name: error
            type: string
            doc: Error message if cancellation failed

      - name: DeployVersion
        index: 9
        doc: Deploy an existing app version (used for rollback and redeploy). Server handles everything — creates deployment record, activates version, marks previous deployment.
        parameters:
          - name: app_name
            type: string
            doc: The application name
          - name: cluster_id
            type: string
            doc: The cluster to deploy to
          - name: app_version_id
            type: string
            doc: The version string to deploy (e.g. myapp-v3k7n2p)
          - name: is_rollback
            type: bool
            doc: If true, previous active deployment marked as rolled_back instead of succeeded
          - name: env_vars
            type: '[]*EnvironmentVariable'
            doc: Environment variables to set (creates a derived version with these vars merged in)
          - name: ephemeral_label
            type: string
            doc: If set, deploy as ephemeral version with this label (skip activation)
          - name: ephemeral_ttl
            type: string
            doc: TTL for ephemeral version (e.g., "48h"), defaults to "24h" when ephemeral_label is set
        results:
          - name: deployment
            type: DeploymentInfo
            doc: The newly created deployment record
          - name: error
            type: string
            doc: Error message if deploy failed
          - name: lock_info
            type: DeploymentLockInfo
            doc: Structured information about the deployment lock (if blocked)
          - name: access_info
            type: '*AccessInfo'
            doc: Information about how to access the deployed app

      - name: SetEnvVars
        index: 10
        doc: Set environment variables on an app, creating a new version and deployment record. Returns deployment info for activation polling.
        parameters:
          - name: app_name
            type: string
            doc: The application name
          - name: cluster_id
            type: string
            doc: The cluster where deployment is happening
          - name: vars
            type: '[]*EnvironmentVariable'
            doc: Environment variables to set
          - name: service
            type: string
            doc: Service name to scope env vars to (optional, empty means global)
        results:
          - name: version_id
            type: string
            doc: The new version string
          - name: deployment
            type: DeploymentInfo
            doc: The deployment record
          - name: error
            type: string
            doc: Error message if operation failed
          - name: lock_info
            type: DeploymentLockInfo
            doc: Structured information about the deployment lock (if blocked)
          - name: access_info
            type: '*AccessInfo'
            doc: Information about how to access the deployed app

      - name: GetDeployLock
        index: 12
        doc: >
          Report whether a deployment lock is currently held for an app+cluster,
          and by whom. Read-only. Used by clients as an advisory pre-flight before
          uploading a build context, so a blocked deploy can be reported without
          wasting the upload. A held=false result means the next deploy would not
          be blocked at call time; it is advisory, not a reservation.
        parameters:
          - name: app_name
            type: string
            doc: The application name
          - name: cluster_id
            type: string
            doc: The cluster to check
        results:
          - name: held
            type: bool
            doc: Whether a deployment lock is currently held
          - name: lock_info
            type: DeploymentLockInfo
            doc: Details of the holding deployment (only set when held)

      - name: DeleteEnvVars
        index: 11
        doc: Delete environment variables from an app, creating a new version and deployment record. Returns deployment info for activation polling.
        parameters:
          - name: app_name
            type: string
            doc: The application name
          - name: cluster_id
            type: string
            doc: The cluster where deployment is happening
          - name: keys
            type: '[]string'
            doc: Environment variable keys to delete
          - name: service
            type: string
            doc: Service name to scope deletion to (optional, empty means global)
        results:
          - name: version_id
            type: string
            doc: The new version string
          - name: deployment
            type: DeploymentInfo
            doc: The deployment record
          - name: error
            type: string
            doc: Error message if operation failed
          - name: lock_info
            type: DeploymentLockInfo
            doc: Structured information about the deployment lock (if blocked)
          - name: access_info
            type: '*AccessInfo'
            doc: Information about how to access the deployed app
          - name: deleted_sources
            type: '[]string'
            doc: Source of each deleted variable (config or manual)

types:
  - type: DeploymentInfo
    doc: Information about a deployment
    fields:
      - name: id
        type: string
        index: 0
        doc: Unique deployment ID
      - name: app_name
        type: string
        index: 1
        doc: The application name
      - name: app_version_id
        type: string
        index: 2
        doc: The app version ID
      - name: cluster_id
        type: string
        index: 3
        doc: The cluster ID
      - name: status
        type: string
        index: 4
        doc: Current deployment status
      - name: phase
        type: string
        index: 5
        doc: Current deployment phase
      - name: deployed_by_user_id
        type: string
        index: 6
        doc: ID of the user who deployed
      - name: deployed_by_user_email
        type: string
        index: 7
        doc: Email of the user who deployed
      - name: deployed_by_user_name
        type: string
        index: 21
        doc: Username of the user who deployed
      - name: deployed_at
        type: standard.Timestamp
        index: 8
        doc: When the deployment was initiated
      - name: completed_at
        type: standard.Timestamp
        index: 9
        doc: When the deployment was completed (optional)
      - name: error_message
        type: string
        index: 10
        doc: Error message if deployment failed (optional)
      - name: build_logs
        type: string
        index: 11
        doc: Build logs from the deployment (especially for failures)
      - name: git_info
        type: GitInfo
        index: 12
        doc: Git information at time of deployment (optional)
      - name: source_deployment_id
        type: string
        index: 22
        doc: ID of the source deployment (set for rollback/redeploy, empty for fresh builds)
      - name: short_id
        type: string
        index: 23
        doc: Short human-friendly ID for this deployment
      - name: app_version_short_id
        type: string
        index: 24
        doc: Short human-friendly ID for the app version

  - type: GitInfo
    doc: Git repository information
    fields:
      - name: sha
        type: string
        index: 0
        doc: Git commit SHA
      - name: ref
        type: string
        index: 1
        doc: Git reference (tag or branch)
      - name: branch
        type: string
        index: 2
        doc: Git branch name
      - name: repository
        type: string
        index: 3
        doc: Git repository URL
      - name: is_dirty
        type: bool
        index: 4
        doc: Whether working tree had uncommitted changes
      - name: working_tree_hash
        type: string
        index: 5
        doc: Hash of working tree if dirty
      - name: commit_message
        type: string
        index: 6
        doc: Git commit message
      - name: commit_author_name
        type: string
        index: 7
        doc: Name of commit author
      - name: commit_author_email
        type: string
        index: 8
        doc: Email of commit author
      - name: commit_timestamp
        type: standard.Timestamp
        index: 9
        doc: When the commit was made

  - type: DeploymentLockInfo
    doc: Information about a deployment lock blocking a new deployment
    fields:
      - name: app_name
        type: string
        index: 0
        doc: The application name
      - name: cluster_id
        type: string
        index: 1
        doc: The cluster ID
      - name: blocking_deployment_id
        type: string
        index: 2
        doc: The ID of the deployment holding the lock
      - name: started_by
        type: string
        index: 3
        doc: Email or username of who started the blocking deployment
      - name: started_at
        type: standard.Timestamp
        index: 4
        doc: When the blocking deployment was started
      - name: current_phase
        type: string
        index: 5
        doc: Current phase of the blocking deployment
      - name: lock_expires_at
        type: standard.Timestamp
        index: 6
        doc: When the lock will expire
      - name: blocking_deployment_short_id
        type: string
        index: 7
        doc: Short human-friendly ID for the blocking deployment

  - type: EnvironmentVariable
    doc: An environment variable to set on the app during deploy
    fields:
      - name: key
        type: string
        index: 0
        doc: Environment variable name
      - name: value
        type: string
        index: 1
        doc: Environment variable value
      - name: sensitive
        type: bool
        index: 2
        doc: Whether this is a sensitive value that should be masked

  - type: AccessInfo
    doc: Information about how to access the deployed application
    fields:
      - name: hostnames
        type: '[]string'
        index: 0
        doc: Hostnames where the app is accessible (from configured routes)
      - name: default_route
        type: bool
        index: 1
        doc: Whether this app is the default route
      - name: cluster_hostname
        type: string
        index: 2
        doc: Cloud-provisioned DNS hostname for the cluster (if registered with Miren Cloud)