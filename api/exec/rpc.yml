apiVersion: miren.dev/rpc/v1
kind: IDL

imports:
  stream:
    path: ../../pkg/rpc/stream/stream.yml
    import: miren.dev/runtime/pkg/rpc/stream

types:
  - type: WindowSize
    fields:
      - name: height
        type: int32
        index: 0
      - name: width
        type: int32
        index: 1
  - type: ShellOptions
    fields:
      - name: terminal
        type: bool
        index: 0
      - name: command
        type: list
        element: string
        index: 1
      - name: win_size
        type: WindowSize
        index: 2
      - name: env
        type: list
        element: string
        index: 3
      - name: pool
        type: string
        index: 4

interfaces:
  - name: SandboxExec
    methods:
      - name: exec
        parameters:
          - name: category
            type: string
          - name: value
            type: string
          - name: command
            type: string
          - name: options
            type: ShellOptions
          - name: input
            type: stream.RecvStream[[]byte]
          - name: output
            type: stream.SendStream[[]byte]
          - name: window_updates
            type: stream.RecvStream[*WindowSize]
        results:
          - name: code
            type: int32

      # attach joins a client to a container's existing primary process,
      # rather than executing a second process beside it the way exec does.
      #
      # The distinction is the whole point: an exec'd process belongs to the
      # client that started it and dies with it, taking its exit code along.
      # An attached client is a subscriber -- it can come and go, several can
      # watch at once, and none of that reaches the workload.
      - name: attach
        parameters:
          - name: sandbox
            type: string
          - name: container
            type: string
            doc: Container within the sandbox; empty means the app container
          - name: input
            type: stream.RecvStream[[]byte]
          - name: output
            type: stream.SendStream[[]byte]
          - name: window_updates
            type: stream.RecvStream[*WindowSize]
