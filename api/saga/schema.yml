domain: dev.miren.saga
version: v1alpha
kinds:
  saga:
    definition_name:
      type: string
      doc: The name of the registered saga definition
      indexed: true

    definition_version:
      type: int
      doc: The version of the definition when this execution started

    status:
      type: enum
      doc: Current execution status
      choices: [pending, running, undoing, completed, failed]
      indexed: true

    initial_inputs:
      type: bytes
      doc: JSON-encoded initial inputs for the saga

    executed_actions:
      type: bytes
      doc: JSON-encoded map of action name to ActionResult

    execution_order:
      type: bytes
      doc: JSON-encoded array of action names in execution order

    parent_execution_id:
      type: ref
      doc: Reference to the parent saga execution (set for child/nested sagas)
      indexed: true

    recovery_scope:
      type: string
      doc: Stable identity of the executor allowed to recover this execution

    error:
      type: string
      doc: Error message if the saga failed

    created_at:
      type: time
      doc: When the execution was created

    updated_at:
      type: time
      doc: When the execution last changed state
