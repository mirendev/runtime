# Distributed runner testing with iso peers.
#
# The coordinator peer runs the miren server in standalone mode.
# The runner peer joins the coordinator and runs as a distributed runner.
#
# Services (etcd, VictoriaMetrics, VictoriaLogs) from services.yml are
# automatically connected to the peers network, so they're reachable by
# service name from all peers.

peers:
  coordinator:
    hostname: coordinator
    environment:
      ROLE: coordinator
      MIREN_LABS: distributedrunners
      # Dev runs WireGuard ahead of the shipped default (still vxlan) so the
      # overlay-encryption blackbox test has something to assert against, and
      # so the backend the clusters are migrating to is the one exercised
      # every time anyone brings this environment up. Runners inherit it from
      # the coordinator at join time.
      MIREN_SERVER_NETWORK_BACKEND: wireguard
    ports:
      - "8443:8443"

  runner1:
    hostname: runner1
    environment:
      ROLE: runner
      MIREN_LABS: distributedrunners
