package: serverconfig

configs:
  Config:
    description: Complete server configuration from all sources
    fields:
      config_file:
        type: string
        description: "Path to configuration file"
        cli:
          long: config
          description: "Path to configuration file"
        cli_only: true  # This field is only for CLI, not stored in config
      mode:
        type: string
        default: standalone
        cli:
          long: mode
          short: m
          description: "Server mode: standalone (default), distributed (experimental)"
        env: MIREN_MODE
        toml: mode
        validation:
          enum: [standalone, distributed]

      labs:
        type: "[]string"
        default: []
        cli:
          long: labs
          description: "Comma-separated list of Miren Labs features to enable/disable. Prefix with - to disable."
        env: MIREN_LABS
        toml: labs

      server:
        type: ServerConfig
        toml: server
        nested: true

      ingress:
        type: IngressConfig
        toml: ingress
        nested: true

      tls:
        type: TLSConfig
        toml: tls
        nested: true

      etcd:
        type: EtcdConfig
        toml: etcd
        nested: true

      victorialogs:
        type: VictoriaLogsConfig
        toml: victorialogs
        nested: true

      victoriametrics:
        type: VictoriaMetricsConfig
        toml: victoriametrics
        nested: true

      containerd:
        type: ContainerdConfig
        toml: containerd
        nested: true

      buildkit:
        type: BuildkitConfig
        toml: buildkit
        nested: true

      app_version:
        type: AppVersionConfig
        toml: app_version
        nested: true

      saga:
        type: SagaConfig
        toml: saga
        nested: true

      secrets:
        type: SecretsConfig
        toml: secrets
        nested: true

  ServerConfig:
    description: Core server settings
    fields:
      address:
        type: string
        default: :8443
        cli:
          long: address
          short: a
          description: Address to listen on (host:port). For IPv6 use brackets, e.g. "[::1]:8443".
        env: MIREN_SERVER_ADDRESS
        toml: address
        validation:
          format: host:port

      runner_address:
        type: string
        default: localhost:8444
        cli:
          long: runner-address
          description: Runner address (host:port). For IPv6 use brackets, e.g. "[::1]:8444".
        env: MIREN_SERVER_RUNNER_ADDRESS
        toml: runner_address
        validation:
          format: host:port

      data_path:
        type: string
        default: /var/lib/miren
        cli:
          long: data-path
          short: d
          description: Data path
        env: MIREN_SERVER_DATA_PATH
        toml: data_path

      runner_id:
        type: string
        default: miren
        cli:
          long: runner-id
          short: r
          description: Runner ID
        env: MIREN_SERVER_RUNNER_ID
        toml: runner_id

      release_path:
        type: string
        default: ""
        cli:
          long: release-path
          description: Path to release directory containing binaries
        env: MIREN_SERVER_RELEASE_PATH
        toml: release_path

      config_cluster_name:
        type: string
        default: local
        cli:
          long: config-cluster-name
          short: C
          description: Name of the cluster in client config
        env: MIREN_SERVER_CONFIG_CLUSTER_NAME
        toml: config_cluster_name

      skip_client_config:
        type: bool
        default: false
        cli:
          long: skip-client-config
          description: Skip writing client config file to clientconfig.d
        env: MIREN_SERVER_SKIP_CLIENT_CONFIG
        toml: skip_client_config

      http_request_timeout:
        type: int
        default: 60
        cli:
          long: http-request-timeout
          description: HTTP request timeout in seconds
        env: MIREN_SERVER_HTTP_REQUEST_TIMEOUT
        toml: http_request_timeout
        validation:
          min: 1

      stop_sandboxes_on_shutdown:
        type: bool
        default: false
        cli:
          long: stop-sandboxes-on-shutdown
          description: Stop all sandboxes when server shuts down (useful in development)
        env: MIREN_SERVER_STOP_SANDBOXES_ON_SHUTDOWN
        toml: stop_sandboxes_on_shutdown

      disk_mode:
        type: string
        default: ""
        cli:
          long: disk-mode
          description: "Disk I/O mode: auto (default, detect from hardware), universal (loop devices), or accelerator (lbd devices)"
        env: MIREN_DISK_MODE
        toml: disk_mode
        validation:
          enum: ["", auto, universal, accelerator]

  IngressConfig:
    description: HTTP/HTTPS ingress configuration. See RFD-84 for the mode-based design.
    fields:
      mode:
        type: string
        default: tls-autoprovision
        cli:
          long: ingress-mode
          description: "Ingress mode: tls-autoprovision (default, :443 + :80 with ACME or self-signed), behind-proxy-http (plain HTTP for use behind a TLS-terminating proxy), behind-proxy-https (TLS terminated by Miren; certs come from self-signed or DNS-01 ACME, since :80 isn't bound for HTTP-01)"
        env: MIREN_INGRESS_MODE
        toml: mode
        validation:
          enum: [tls-autoprovision, behind-proxy-http, behind-proxy-https]

      address:
        type: string
        default: ""
        cli:
          long: ingress-address
          description: "Optional bind override. Replaces the mode's default bind entirely (interface and port). Rejected by validation in tls-autoprovision (where :443 + :80 is structural). Reserved unix:/path prefix is not yet supported."
        env: MIREN_INGRESS_ADDRESS
        toml: address

  TLSConfig:
    description: TLS certificate settings. Consulted only when ingress.mode is tls-autoprovision or behind-proxy-https.
    fields:
      standard_tls:
        type: bool
        cli:
          long: serve-tls
          description: "Deprecated and ignored. Retained as a no-op so existing systemd unit files, env vars, and config files from pre-RFD-84 installs still parse. Use ingress.mode to pick the deployment shape."
          hidden: true
        env: MIREN_TLS_STANDARD_TLS
        toml: standard_tls

      additional_names:
        type: "[]string"
        default: []
        cli:
          long: dns-names
          description: Additional DNS names assigned to the server cert
        env: MIREN_TLS_ADDITIONAL_NAMES
        toml: additional_names

      additional_ips:
        type: "[]string"
        default: []
        cli:
          long: ips
          description: Additional IPs assigned to the server cert
        env: MIREN_TLS_ADDITIONAL_IPS
        toml: additional_ips
        validation:
          format: ip_list

      acme_dns_provider:
        type: string
        default: ""
        cli:
          long: acme-dns-provider
          description: DNS provider for ACME DNS-01 challenges (e.g., cloudflare, route53, exec). When set, uses DNS challenge instead of HTTP challenge. See https://go-acme.github.io/lego/dns/ for available providers.
        env: MIREN_TLS_ACME_DNS_PROVIDER
        toml: acme_dns_provider

      acme_email:
        type: string
        default: ""
        cli:
          long: acme-email
          description: Email address for ACME account registration (recommended for account recovery and notifications)
        env: MIREN_TLS_ACME_EMAIL
        toml: acme_email

      self_signed:
        type: bool
        default: false
        cli:
          long: self-signed-tls
          description: Use self-signed certificates for TLS (for development/testing only)
        env: MIREN_TLS_SELF_SIGNED
        toml: self_signed

  EtcdConfig:
    description: Etcd configuration
    fields:
      endpoints:
        type: "[]string"
        default: []
        cli:
          long: etcd
          short: e
          description: Etcd endpoints
        env: MIREN_ETCD_ENDPOINTS
        toml: endpoints

      prefix:
        type: string
        default: /miren
        cli:
          long: etcd-prefix
          short: p
          description: Etcd prefix
        env: MIREN_ETCD_PREFIX
        toml: prefix

      start_embedded:
        type: bool
        cli:
          long: start-etcd
          description: Start embedded etcd server
        env: MIREN_ETCD_START_EMBEDDED
        toml: start_embedded
        mode_default:
          standalone: true

      client_port:
        type: int
        default: 12379
        cli:
          long: etcd-client-port
          description: Etcd client port
        env: MIREN_ETCD_CLIENT_PORT
        toml: client_port
        validation:
          port: true

      peer_port:
        type: int
        default: 12380
        cli:
          long: etcd-peer-port
          description: Etcd peer port
        env: MIREN_ETCD_PEER_PORT
        toml: peer_port
        validation:
          port: true

      http_client_port:
        type: int
        default: 12381
        cli:
          long: etcd-http-client-port
          description: Etcd HTTP client port
        env: MIREN_ETCD_HTTP_CLIENT_PORT
        toml: http_client_port
        validation:
          port: true

      quota_backend_bytes:
        # int is 64-bit on the amd64/arm64 targets miren builds for, so byte counts up
        # to the 8 GiB cap fit; the config generator has no int64 type. Negatives are
        # rejected so a bad value fails early rather than silently auto-sizing.
        type: int
        default: 0
        cli:
          long: etcd-quota-backend-bytes
          description: Etcd backend quota in bytes (0 = auto-size from system RAM)
        env: MIREN_ETCD_QUOTA_BACKEND_BYTES
        toml: quota_backend_bytes
        validation:
          min: 0

  VictoriaLogsConfig:
    description: VictoriaLogs configuration
    fields:
      start_embedded:
        type: bool
        cli:
          long: start-victorialogs
          description: Start embedded VictoriaLogs server
        env: MIREN_VICTORIALOGS_START_EMBEDDED
        toml: start_embedded
        mode_default:
          standalone: true

      http_port:
        type: int
        default: 9428
        cli:
          long: victorialogs-http-port
          description: VictoriaLogs HTTP port in embedded mode
        env: MIREN_VICTORIALOGS_HTTP_PORT
        toml: http_port
        validation:
          port: true

      retention_period:
        type: string
        default: "30d"
        cli:
          long: victorialogs-retention
          description: VictoriaLogs retention period (e.g. 30d, 2w, 1y)
        env: MIREN_VICTORIALOGS_RETENTION_PERIOD
        toml: retention_period
        validation:
          regex: '^\d+(ms|s|m|h|d|w|y)$'

      address:
        type: string
        default: "victorialogs:9428"
        cli:
          long: victorialogs-addr
          description: VictoriaLogs address (when not using embedded)
        env: MIREN_VICTORIALOGS_ADDRESS
        toml: address
        validation:
          format: host:port

  VictoriaMetricsConfig:
    description: VictoriaMetrics configuration
    fields:
      start_embedded:
        type: bool
        cli:
          long: start-victoriametrics
          description: Start embedded VictoriaMetrics server
        env: MIREN_VICTORIAMETRICS_START_EMBEDDED
        toml: start_embedded
        mode_default:
          standalone: true

      http_port:
        type: int
        default: 8428
        cli:
          long: victoriametrics-http-port
          description: VictoriaMetrics HTTP port in embedded mode
        env: MIREN_VICTORIAMETRICS_HTTP_PORT
        toml: http_port
        validation:
          port: true

      retention_period:
        type: string
        default: "1"
        cli:
          long: victoriametrics-retention
          description: VictoriaMetrics retention period in months
        env: MIREN_VICTORIAMETRICS_RETENTION_PERIOD
        toml: retention_period
        validation:
          regex: '^\d+$'

      address:
        type: string
        default: "victoriametrics:8428"
        cli:
          long: victoriametrics-addr
          description: VictoriaMetrics address (when not using embedded)
        env: MIREN_VICTORIAMETRICS_ADDRESS
        toml: address
        validation:
          format: host:port

  ContainerdConfig:
    description: Containerd configuration
    fields:
      start_embedded:
        type: bool
        cli:
          long: start-containerd
          description: Start embedded containerd daemon
        env: MIREN_CONTAINERD_START_EMBEDDED
        toml: start_embedded
        mode_default:
          standalone: true

      binary_path:
        type: string
        default: containerd
        cli:
          long: containerd-binary
          description: Path to containerd binary
        env: MIREN_CONTAINERD_BINARY_PATH
        toml: binary_path

      socket_path:
        type: string
        default: ""
        cli:
          long: containerd-socket
          description: Path to containerd socket
        env: MIREN_CONTAINERD_SOCKET_PATH
        toml: socket_path

  BuildkitConfig:
    description: BuildKit daemon configuration
    fields:
      start_embedded:
        type: bool
        cli:
          long: start-buildkit
          description: Start embedded BuildKit daemon for container image builds
        env: MIREN_BUILDKIT_START_EMBEDDED
        toml: start_embedded
        mode_default:
          standalone: true

      socket_path:
        type: string
        default: ""
        cli:
          long: buildkit-socket
          description: Path to external BuildKit Unix socket (for distributed mode)
        env: MIREN_BUILDKIT_SOCKET_PATH
        toml: socket_path

      socket_dir:
        type: string
        default: ""
        cli:
          long: buildkit-socket-dir
          description: Directory for embedded BuildKit Unix socket (defaults to data_path/buildkit/socket)
        env: MIREN_BUILDKIT_SOCKET_DIR
        toml: socket_dir

      gc_keep_storage:
        type: string
        default: "10GB"
        cli:
          long: buildkit-gc-storage
          description: Maximum BuildKit layer cache size (e.g., 10GB, 50GB)
        env: MIREN_BUILDKIT_GC_KEEP_STORAGE
        toml: gc_keep_storage

      gc_keep_duration:
        type: string
        default: "7d"
        cli:
          long: buildkit-gc-duration
          description: How long to keep BuildKit cache entries (e.g., 7d, 24h)
        env: MIREN_BUILDKIT_GC_KEEP_DURATION
        toml: gc_keep_duration

  AppVersionConfig:
    description: App version retention garbage collection
    fields:
      retention_count:
        type: int
        default: 10
        cli:
          long: app-version-retention-count
          description: Number of most-recent versions to retain per app regardless of age
        env: MIREN_APP_VERSION_RETENTION_COUNT
        toml: retention_count

      retention_period:
        type: string
        default: "30d"
        cli:
          long: app-version-retention-period
          description: Retain versions newer than this duration regardless of count (e.g. 30d, 2w)
        env: MIREN_APP_VERSION_RETENTION_PERIOD
        toml: retention_period

  SecretsConfig:
    description: Secret storage and cluster key rotation
    fields:
      key_rotation_period:
        type: string
        default: "90d"
        cli:
          long: secret-key-rotation-period
          description: Rotate the cluster key that encrypts stored secrets once it reaches this age (e.g. 90d, 1y). Set to 0 to rotate only on request.
        env: MIREN_SECRET_KEY_ROTATION_PERIOD
        toml: key_rotation_period

  SagaConfig:
    description: Saga execution retention garbage collection
    fields:
      retention_period:
        type: string
        default: "7d"
        cli:
          long: saga-retention-period
          description: Delete finished saga executions older than this duration (e.g. 7d, 24h). Set to 0 to keep them indefinitely.
        env: MIREN_SAGA_RETENTION_PERIOD
        toml: retention_period
